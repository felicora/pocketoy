<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky Capsule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#4b2a2a;--bg1:#fff6e6;--bg2:#ffd3e0;--cream:#fff6e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2));color:var(--ink);font:500 16px/1.25 'Baloo 2',ui-rounded,'Hiragino Maru Gothic ProN',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.well:focus-visible{outline:3px solid #6b5bff;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.deco{position:fixed;z-index:0;opacity:.38;pointer-events:none;line-height:1}
.mw{position:relative;z-index:1}
/* shell */
.machine{position:absolute;left:0;top:0;width:360px;height:752px;transform-origin:0 0;border:5px solid var(--ink);border-radius:50px;background:linear-gradient(#ffb8cb,#ff98b2);box-shadow:inset 0 10px 0 rgba(255,255,255,.5),inset 0 -14px 0 rgba(120,30,60,.12)}
.machine>*{position:absolute}
.machine[data-view=home] .colp,.machine[data-view=col] .hm{display:none}
.machine.rumble{animation:rumble .12s infinite}
.machine.shiver{animation:shiver .09s infinite}
.machine.thunk{animation:thunk .45s}
@keyframes rumble{25%{transform:translate(2px,-1px) scale(var(--s))}75%{transform:translate(-2px,1px) scale(var(--s))}}
@keyframes shiver{25%{transform:translate(.9px,-.5px) scale(var(--s))}75%{transform:translate(-.9px,.5px) scale(var(--s))}}
@keyframes thunk{30%{transform:translateY(7px) scale(var(--s))}60%{transform:translateY(-2px) scale(var(--s))}}
.rb{top:8px;width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);background:#ffe38a;font-size:22px;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 5px 0 var(--ink),inset 0 4px 0 rgba(255,255,255,.65);transition:transform .08s,box-shadow .08s}
.rb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 4px 0 rgba(255,255,255,.65)}
.rb[aria-pressed=true]{background:#a8e8cf}
.rb.jig{animation:jig .7s}
@keyframes jig{25%{transform:scale(1.3) rotate(-12deg)}55%{transform:scale(.9) rotate(8deg)}}
#bHome{left:12px}#bGift{right:12px}
.ttl{left:50%;top:6px;transform:translateX(-50%);background:#ffe38a;border:4px solid var(--ink);border-radius:99px;padding:0 16px;font-weight:800;font-size:21px;line-height:26px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.count{left:50%;top:40px;transform:translateX(-50%);background:var(--cream);border:3px solid var(--ink);border-radius:99px;padding:0 12px;font-weight:800;font-size:14px;line-height:18px;white-space:nowrap}
.count.bump{animation:bump .5s}
@keyframes bump{40%{transform:translateX(-50%) scale(1.25) rotate(-3deg)}}
.base{left:50%;margin-left:-125px;top:338px;width:250px;height:24px;background:#a8e8cf;border:4px solid var(--ink);border-radius:14px}
.plate{left:14px;right:14px;top:372px;height:244px;border-radius:38px;background:rgba(255,255,255,.26)}
.globe{left:29px;top:66px;width:292px;height:292px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95),rgba(255,255,255,.6) 40%,rgba(215,238,255,.8))}
.globe canvas{position:absolute;inset:0;width:100%;height:100%}
.rim{position:absolute;inset:0;z-index:2;border:5px solid var(--ink);border-radius:50%;pointer-events:none;box-shadow:inset 0 -14px 22px rgba(140,180,255,.22)}
.glare{position:absolute;z-index:2;left:44px;top:38px;width:62px;height:26px;border-radius:50%;background:rgba(255,255,255,.5);transform:rotate(-38deg);pointer-events:none}
.well{left:50%;margin-left:-98px;top:388px;width:196px;height:196px;border-radius:50%;background:#a8e8cf;border:5px solid var(--ink);box-shadow:inset 0 7px 0 rgba(0,0,0,.12),0 5px 0 rgba(120,30,60,.25);touch-action:none;cursor:grab}
.well:active{cursor:grabbing}
.well svg{position:absolute;inset:0;width:100%;height:100%}
.ring{left:50%;margin-left:-150px;top:336px;width:300px;height:300px;pointer-events:none;transition:opacity .3s}
.machine.ready .ring{opacity:0}
.hintarc{animation:pulse 1.5s infinite}.turned .hintarc{animation:none}
@keyframes pulse{50%{opacity:.4}}
.tray{left:50%;margin-left:-150px;top:626px;width:300px;height:100px;border:5px solid var(--ink);border-radius:38px;background:#fff1dc;box-shadow:0 5px 0 rgba(120,30,60,.25)}
.inner{position:absolute;inset:5px;border-radius:30px;overflow:hidden;background:linear-gradient(#ffe0bd,#fff6e6 45%,#ffe9d0)}
.lip{position:absolute;left:0;right:0;top:0;height:10px;background:#ffb8cb;border-bottom:4px solid var(--ink);z-index:2}
.tip{position:absolute;left:50%;top:-36px;transform:translateX(-50%);background:#ffe38a;border:4px solid var(--ink);border-radius:99px;padding:0 14px;font-weight:800;font-size:18px;line-height:26px;white-space:nowrap;opacity:0;box-shadow:0 3px 0 var(--ink);pointer-events:none}
.tray.ready .tip{opacity:1;animation:bob 1s infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.tcap{position:absolute;left:50%;bottom:3px;width:66px;height:66px;border:0;background:none;padding:0;transform:translateX(-50%)}
.tcap .cw{display:block}.tcap.ready .cw{animation:wig 1.1s infinite}
@keyframes wig{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-6deg)}}
.bt,.tp{transform-box:fill-box;transform-origin:center}
/* collection panel */
.colp{left:12px;right:12px;top:64px;bottom:12px;background:var(--cream);border:4px solid var(--ink);border-radius:30px;overflow-y:auto;padding:10px 10px 18px;-webkit-user-select:none;overscroll-behavior:contain}
.bar{height:16px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ebc,#ffd966);transition:width .5s}
.colp h3{margin:10px 2px 6px;font-size:17px;font-weight:800;display:flex;justify-content:space-between}
.colp h3 span{opacity:.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cell{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 2px 4px;text-align:center;position:relative;box-shadow:0 3px 0 var(--ink)}
.cell .pc{height:54px;display:flex;align-items:center;justify-content:center}
.cell img{max-height:50px;max-width:62px}
.cell:not(.on) img{filter:brightness(0);opacity:.13}
.cell b{display:block;font-size:12px;line-height:1.05;margin-top:2px}
.cell em{font-style:normal;font-size:10px;opacity:.6;font-weight:700}
.cell .n{position:absolute;right:5px;top:2px;font-size:11px;font-weight:800;opacity:.6}
.cell.on.r2{border-color:#c9921a}
.done{text-align:center;font-weight:800;margin:4px 0}
.note{text-align:center;opacity:.65;font-weight:700;margin:14px 0 0;font-size:14px}
.reset{display:block;margin:8px auto 0;background:none;border:0;opacity:.6;text-decoration:underline;font-weight:700}
/* reveal: takes over the whole screen */
.rv{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.rv[hidden]{display:none}
.rvbg{position:absolute;inset:0;background:linear-gradient(170deg,#fff6e6,#ffc9da);animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.rvc{position:relative;width:min(420px,100%);text-align:center;display:flex;flex-direction:column;align-items:center}
.stage{position:relative;height:290px;width:100%;display:flex;align-items:center;justify-content:center}
.rays{position:absolute;width:380px;height:380px;border-radius:50%;opacity:0;background:repeating-conic-gradient(from 0deg,var(--ray,#ffb3cf) 0 12deg,transparent 12deg 30deg);-webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);animation:spin 10s linear infinite;transition:opacity .4s}
.rays.on{opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
#capbig{position:absolute}
#capbig.shake{animation:shk .55s}
@keyframes shk{20%{transform:rotate(-16deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(7deg)}}
#capbig.pop .tp{animation:tpf .55s forwards}#capbig.pop .bt{animation:btf .55s forwards}
@keyframes tpf{to{transform:translate(-40px,-130px) rotate(-55deg);opacity:0}}
@keyframes btf{to{transform:translate(40px,110px) rotate(45deg);opacity:0}}
#pic{position:absolute;display:flex;align-items:center;justify-content:center;transform:scale(0)}
#pic img{max-height:240px;max-width:280px;filter:drop-shadow(0 5px 0 rgba(75,42,42,.15))}
#pic.in{animation:sprin .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes sprin{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
.fx{position:absolute;left:50%;top:50%;width:13px;height:13px;pointer-events:none}
.sh{opacity:0;transform:translateY(8px);transition:.35s}.sh.show{opacity:1;transform:none}
#rpop{font-size:36px;font-weight:800;color:#ff5d8f;text-shadow:0 3px 0 #fff;line-height:1;margin-bottom:-6px}
.new{display:inline-block;background:#ff5d8f;color:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 16px;font-weight:800;font-size:24px;transform:rotate(-5deg);box-shadow:0 3px 0 var(--ink)}
.new.show{animation:stick .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes stick{from{transform:scale(2.4) rotate(12deg);opacity:0}}
.rvc h2{margin:4px 0 4px;font-size:38px;font-weight:800;line-height:1}
.pill{display:inline-block;border:3px solid var(--ink);border-radius:99px;padding:0 16px;font-weight:800;font-size:16px}
.r0{background:#c8f0de}.r1{background:#a9defa}.r2{background:linear-gradient(100deg,#ffd34d,#ffb3d1,#b9a7ff,#ffd34d);background-size:200%;animation:sheen 2.4s linear infinite}
@keyframes sheen{to{background-position:200% 0}}
#rnote{margin:8px 0 0;opacity:.7;font-weight:700}
.btn{border:3px solid var(--ink);border-radius:99px;background:#ffe38a;font-weight:800;font-size:18px;padding:4px 26px;margin-top:14px;box-shadow:0 4px 0 var(--ink)}
.rainbow{animation:hue 3.5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.machine.rumble,.machine.shiver,.rays,.rainbow,.hintarc,.r2,.tcap.ready .cw,.tray.ready .tip{animation:none}}
</style></head>
<body>
<div class="mw" id="mw"><div class="machine" id="m" data-view="home">
  <button class="rb" id="bHome" aria-label="Home" aria-pressed="true">🏠</button>
  <div class="ttl">Lucky Capsule</div>
  <button class="rb" id="bGift" aria-label="Collection" aria-pressed="false">🎁</button>
  <div class="count" id="count"></div>

  <div class="base hm"></div>
  <div class="plate hm"></div>
  <div class="globe hm"><canvas id="cv"></canvas><div class="glare"></div><div class="rim"></div></div>
  <svg class="ring hm" viewBox="0 0 300 300" aria-hidden="true">
    <g class="hintarc">
      <path d="M39.7 130.5A112 112 0 0 1 258.2 121" fill="none" stroke="#4b2a2a" stroke-width="16" stroke-linecap="round"/>
      <path d="M39.7 130.5A112 112 0 0 1 258.2 121" fill="none" stroke="#fff3d6" stroke-width="8" stroke-linecap="round"/>
      <polygon points="264.9,146.1 275.6,116.3 240.8,125.7" fill="#fff3d6" stroke="#4b2a2a" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <path id="tp" d="M48.4 221.1A124 124 0 0 0 251.6 221.1" fill="none"/>
    <text font-size="22" font-weight="800" letter-spacing="2.5" fill="#4b2a2a" text-anchor="middle" font-family="'Baloo 2',ui-rounded,system-ui,sans-serif"><textPath href="#tp" startOffset="50%">DRAG TO TURN</textPath></text>
  </svg>
  <div class="well hm" id="well" tabindex="0" role="button" aria-label="Turn the knob clockwise. Press Enter to turn it for you.">
    <svg viewBox="0 0 186 186" id="knob"><rect x="10" y="56" width="166" height="74" rx="37" fill="#ffe38a" stroke="#4b2a2a" stroke-width="6"/><rect x="30" y="64" width="52" height="9" rx="4.5" fill="#fff" opacity=".75"/><circle cx="93" cy="93" r="33" fill="#ff9fb8" stroke="#4b2a2a" stroke-width="6"/><circle cx="93" cy="93" r="11" fill="#4b2a2a"/><circle cx="36" cy="93" r="6" fill="#4b2a2a" opacity=".22"/><circle cx="150" cy="93" r="6" fill="#4b2a2a" opacity=".22"/></svg>
  </div>
  <div class="tray hm" id="tray"><span class="tip">TAP TO OPEN ✨</span><div class="inner" id="inner"><div class="lip"></div></div></div>
  <div class="colp" id="colp"></div>
</div></div>
<div class="sr" id="msg" aria-live="polite"></div>

<div class="rv" id="rv" hidden>
  <div class="rvbg" id="rvbg"></div>
  <div class="rvc">
    <div class="sh" id="rpop">✨ pop! ✨</div>
    <div class="stage"><div class="rays" id="rays"></div><div id="capbig"></div><div id="pic"></div></div>
    <div class="sh new" id="rnew">NEW!</div>
    <h2 class="sh" id="rname"></h2>
    <div class="sh"><span class="pill" id="rrar"></span></div>
    <p class="sh" id="rnote"></p>
    <button class="sh btn" id="collect">Add to collection</button>
  </div>
</div>

    if(wheelVel>25){c.vy-=wheelVel*3.4*Math.random()*h;c.vx+=(Math.random()-.5)*wheelVel*4*h;c.va+=(Math.random()-.5)*wheelVel*.05*h}
    c.vx=Math.max(-650,Math.min(650,c.vx));c.vy=Math.max(-750,Math.min(750,c.vy));
    c.x+=c.vx*h;c.y+=c.vy*h;c.a+=c.va*h;c.va*=.995;if(Math.abs(c.vx)+Math.abs(c.vy)<40){c.vx*=.9;c.vy*=.97}
    const dx=c.x-CX,dy=c.y-CY,d=Math.hypot(dx,dy),lim=WR-RR;
    if(d>lim){const nx=dx/d,ny=dy/d;c.x=CX+nx*lim;c.y=CY+ny*lim;const vn=c.vx*nx+c.vy*ny;if(vn>0){c.vx-=1.5*vn*nx;c.vy-=1.5*vn*ny}c.vx*=.985;c.va=c.vx/RR*.6}
  }
  for(let it=0;it<2;it++)for(let i=0;i<caps.length;i++)for(let j=i+1;j<caps.length;j++){
    const a=caps[i],b=caps[j];if(a.drop||b.drop)continue;
    const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
    if(d<RR*2&&d>0){const nx=dx/d,ny=dy/d,o=(RR*2-d)/2;a.x+=nx*o;a.y+=ny*o;b.x-=nx*o;b.y-=ny*o;
      const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel<0){const k=-1.45*rel/2;a.vx+=k*nx;a.vy+=k*ny;b.vx-=k*nx;b.vy-=k*ny}}
  }
}
function draw(){
  ctx.clearRect(0,0,GS,GS);
  ctx.save();ctx.translate(CX,CY+95);ctx.rotate(wheelA*Math.PI/180);
  for(let i=0;i<3;i++){ctx.rotate(Math.PI*2/3);for(const [w,col] of [[22,'#4b2a2a'],[13,'#bdeedd']]){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(54,0);ctx.stroke()}}
  ctx.fillStyle='#ffd966';ctx.strokeStyle='#4b2a2a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();ctx.stroke();ctx.restore();
  const list=[...caps].sort((a,b)=>(a.drop?1:0)-(b.drop?1:0));
  for(const c of list){
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.lineWidth=4;ctx.strokeStyle='#4b2a2a';ctx.lineJoin='round';
    ctx.fillStyle=c.p[0];ctx.beginPath();ctx.arc(0,0,RR,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=c.p[1];ctx.beginPath();ctx.arc(0,0,RR,0,Math.PI);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(c.x-10,c.y-11,6,3,-.7,0,7);ctx.fill();
  }
}
for(let i=0;i<600;i++)step(1/180);
let last=performance.now();
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  if(mixing)wheelVel=650;else wheelVel*=.93;
  m.classList.toggle('shiver',!mixing&&wheelVel>70);
  for(let i=0;i<3;i++)step(dt/3);
  wheelA+=wheelVel*dt*1.4+(drag?0:0);
  for(let i=caps.length-1;i>=0;i--)if(caps[i].drop&&caps[i].y>GS+RR+4){caps.splice(i,1);if(dropCb){const f=dropCb;dropCb=null;f()}}
  m.style.setProperty('--ga',wheelA*.8);
  draw();requestAnimationFrame(loop)
}
requestAnimationFrame(loop);

/* ---------- knob ---------- */
const well=$('#well'),knob=$('#knob'),msg=t=>$('#msg').textContent=t,body=m,tray=$('#tray');
let state='idle',cum=0,lastA=0,lastT=0,drag=false,vib=0,springId=0;
const ang=e=>{const r=well.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI};
const setKnob=()=>knob.style.transform=`rotate(${cum}deg)`;
well.addEventListener('pointerdown',e=>{if(state!=='idle')return;cancelAnimationFrame(springId);well.setPointerCapture(e.pointerId);drag=true;lastA=ang(e);lastT=performance.now();msg('Keep turning, clockwise…')});
well.addEventListener('pointermove',e=>{
  if(!drag||state!=='idle')return;
  const a=ang(e),now=performance.now();let d=a-lastA;if(d>180)d-=360;if(d<-180)d+=360;
  const dt=Math.max(8,now-lastT);lastA=a;lastT=now;
  cum=Math.max(0,cum+d);wheelVel=Math.max(0,wheelVel*.5+Math.min(1400,d/dt*1000)*.5);
  document.body.classList.add('turned');setKnob();
  const k=Math.floor(cum/60);if(k!==vib){vib=k;navigator.vibrate&&navigator.vibrate(8)}
  if(cum>=360)complete();
});
const release=()=>{if(!drag)return;drag=false;if(state==='idle')springBack()};
well.addEventListener('pointerup',release);well.addEventListener('pointercancel',release);
function springBack(){const from=cum,t0=performance.now();cancelAnimationFrame(springId);
  (function f(t){const p=Math.min(1,(t-t0)/380);cum=from*(1-p*p*(3-2*p));setKnob();if(p<1)springId=requestAnimationFrame(f);else{vib=0;msg('Turn the knob and see what you get.')}})(t0)}
well.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&state==='idle'){e.preventDefault();const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1000);cum=360*p;wheelVel=420;setKnob();if(p<1&&state==='idle')requestAnimationFrame(f);else if(state==='idle')complete()})(t0)}});

async function complete(){
  state='busy';drag=false;cum=360;setKnob();msg('Clunk-clunk… something is rolling!');
  m.classList.add('rumble');mixing=true;await sleep(1300);mixing=false;m.classList.remove('rumble');
  cum=0;setKnob();vib=0;
  const x=Math.random()*100,r=x<5?2:x<30?1:0,pool=C.filter(c=>c[3]===r),it=pool[(Math.random()*pool.length)|0];
  let best=null,bd=1e9;for(const c of caps){const d=Math.hypot(c.x-CX,c.y-(CY+WR));if(d<bd){bd=d;best=c}}
  pend={it,p:best.p};best.drop=true;best.va=rnd(-4,4);
  dropCb=landed;setTimeout(()=>spawn(CX+rnd(-40,40),30),900);
}
async function landed(){
  await sleep(250);
  const el=document.createElement('button');el.className='tcap';el.setAttribute('aria-label','Tap the capsule to open it');
  el.innerHTML=`<span class="cw">${cap(pend.p[0],pend.p[1],66)}</span>`;$('#inner').appendChild(el);
  const fall=el.animate([{transform:'translate(-50%,-140px) rotate(0)',easing:'ease-in'},{transform:'translate(-50%,0) rotate(20deg)',offset:.4},{transform:'translate(-50%,-34px) rotate(40deg)',easing:'ease-in',offset:.55},{transform:'translate(-50%,0) rotate(60deg)',offset:.7},{transform:'translate(-50%,-9px) rotate(70deg)',easing:'ease-in',offset:.82},{transform:'translate(-50%,0) rotate(80deg)'}],{duration:900,fill:'forwards'});
  await fall.finished;body.classList.remove('thunk');void body.offsetWidth;body.classList.add('thunk');
  const roll=el.animate([{transform:'translate(-50%,0) rotate(80deg)'},{transform:'translate(calc(-50% - 80px),0) rotate(-240deg)'}],{duration:850,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  await roll.finished;el.classList.add('ready');tray.classList.add('ready');m.classList.add('ready');state='ready';msg('Tap the capsule!');
  el.onclick=()=>{if(state!=='ready')return;state='reveal';el.remove();tray.classList.remove('ready');m.classList.remove('ready');reveal()};
}

/* ---------- reveal (takes over the whole screen) ---------- */
let canCollect=false,pendWas=false;
function burst(n,cols,dist){const st=$('.stage');for(let i=0;i<n;i++){const s=document.createElement('span');s.className='fx';s.style.background=cols[i%cols.length];s.style.borderRadius=i%2?'50%':'3px';st.appendChild(s);const a=rnd(0,6.28),d=rnd(dist*.5,dist);
  s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d-6}px,${Math.sin(a)*d-6+30}px) rotate(${rnd(-300,300)}deg) scale(.4)`,opacity:0}],{duration:rnd(700,1200),easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>s.remove()}}
async function reveal(){
  const {it,p}=pend,was=!save.found[it[0]];pendWas=was;save.found[it[0]]=(save.found[it[0]]||0)+1;save.pulls++;persist();
  const rv=$('#rv'),big=$('#capbig'),pic=$('#pic'),rays=$('#rays');
  pic.getAnimations().forEach(a=>a.cancel());$('#rvbg').getAnimations().forEach(a=>a.cancel());
  rv.hidden=false;document.querySelectorAll('#rv .sh').forEach(e=>e.classList.remove('show'));pic.className='';pic.innerHTML='';rays.className='rays';
  big.innerHTML=cap(p[0],p[1],190);big.className='shake';
  rays.style.setProperty('--ray',it[3]===2?'#ffd34d':it[3]?'#9fd8ff':'#ffb3cf');
  await sleep(650);
  big.className='pop';pic.innerHTML=img(it);pic.className='in';rays.classList.add('on');$('#rpop').classList.add('show');
  burst([10,18,34][it[3]],['#ff9fb8','#ffe38a','#a9d8f5','#cdb8f5','#a8e8cf'],[120,150,200][it[3]]);
  $('#rname').textContent=it[1];const rr=$('#rrar');rr.textContent=RN[it[3]];rr.className='pill r'+it[3];
  $('#rnew').style.display=was?'inline-block':'none';
  $('#rnote').textContent=was?`${foundN()} / ${C.length} found`:`Already have this one (×${save.found[it[0]]})`;
  await sleep(500);
  [...document.querySelectorAll('#rv .sh:not(#rpop)')].forEach((e,i)=>setTimeout(()=>e.classList.add('show'),i*110));
  await sleep(700);canCollect=true;
}
async function collect(){
  if(!canCollect)return;canCollect=false;
  const pic=$('#pic'),bg=$('#rvbg'),r=pic.getBoundingClientRect(),g=$('#bGift').getBoundingClientRect();
  const dx=g.left+g.width/2-(r.left+r.width/2),dy=g.top+g.height/2-(r.top+r.height/2);
  document.querySelectorAll('#rv .sh').forEach(e=>e.classList.remove('show'));$('#rays').classList.remove('on');
  const f=pic.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate(0,-36px) scale(1.1)',offset:.22},{transform:`translate(${dx}px,${dy}px) scale(.1) rotate(220deg)`}],{duration:800,easing:'cubic-bezier(.55,0,.75,.45)',fill:'forwards'});
  bg.animate([{opacity:1},{opacity:1,offset:.55},{opacity:0}],{duration:800,fill:'forwards'});
  await f.finished;
  $('#rv').hidden=true;pic.getAnimations().forEach(a=>a.cancel());bg.getAnimations().forEach(a=>a.cancel());
  const gb=$('#bGift');gb.classList.remove('jig');void gb.offsetWidth;gb.classList.add('jig');counter(pendWas);
  state='idle';msg('Turn the knob and see what you get.');
}
$('#collect').onclick=collect;$('#rv').onclick=collect;

/* ---------- collection panel inside the shell ---------- */
function renderCol(){
  const n=foundN(),el=$('#colp');
  let h=`<div class="bar"><i style="width:${n/C.length*100}%"></i></div>`;
  if(n===C.length)h+=`<div class="done">Collection complete! Every capsule found.</div>`;
  RN.forEach((rn,r)=>{const list=C.filter(c=>c[3]===r);
    h+=`<h3>${rn}<span>${list.filter(c=>save.found[c[0]]).length} / ${list.length}</span></h3><div class="grid">`;
    for(const c of list){const k=save.found[c[0]];
      h+=`<div class="cell r${r}${k?' on':''}"><div class="pc">${img(c)}</div><b>${k?c[1]:'???'}</b><em>${k?RN[r]:'Not found'}</em>${k>1?`<span class="n">×${k}</span>`:''}</div>`}
    h+='</div>'});
  h+=`<p class="note">${save.pulls} capsule${save.pulls===1?'':'s'} opened</p><button class="reset" id="reset">Reset collection</button>`;
  el.innerHTML=h;let armed=0;
  $('#reset').onclick=e=>{const b=e.target;if(!armed){armed=1;b.textContent='Tap again to erase everything';setTimeout(()=>{armed=0;b.textContent='Reset collection'},3000)}else{save={found:{},pulls:0};persist();counter();renderCol()}};
}
function setView(v){m.dataset.view=v;$('#bHome').setAttribute('aria-pressed',v==='home');$('#bGift').setAttribute('aria-pressed',v==='col');if(v==='col'){renderCol();$('#colp').scrollTop=0}}
$('#bHome').onclick=()=>setView('home');$('#bGift').onclick=()=>setView('col');

/* ---------- faint edge decorations ---------- */
{const gl=['♡','★','✿','○','✦'],cl=['#ff8fb1','#ffb48a','#7fd6b0','#b9a3f0','#8cc8f0'];
for(let i=0;i<26;i++){const e=document.createElement('span');e.className='deco';e.textContent=gl[i%5];
  const t=((i*37)%97)/97,top=i%2===0;
  e.style.left=(i%4<2?t*94:(i%2?1:94))+'%';e.style.top=(i%4<2?(top?1+(i%3)*1.6:94-(i%3)*1.4):t*88+4)+'%';
  e.style.fontSize=(14+(i*7)%14)+'px';e.style.color=cl[(i*3)%5];e.style.transform=`rotate(${(i*47)%50-25}deg)`;document.body.appendChild(e)}}
counter();
</script>
