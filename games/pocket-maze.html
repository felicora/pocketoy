 {n:'Desert',st:['#b8784c','#b8784c'],ol:'#6d3a1d',bd:['#ffeccb','#fdd9a2'],tint:['#ffd9a8','#fff2d0','#f5c58a'],dc:'rgba(180,120,70,.35)',lb:'#6d3a1d',hk:'spark',ha:'#6d3a1d',cup:['#fff4c8','#e6b565'],emo:['🌵','🐪','🦎','☀️','🏜️'],ds:['🌵','🐪','🦎','☀️','🏜️','⭐'],
  v:{t1:'#ffeccc',t2:'#ffdba5',t3:'#f2c284',s1:'#ffe3bb',s2:'#f8c98b',s3:'#e5a566',sd:'#a8733a',ov:'none',rad:'44px 44px 56px 56px',fr:'26px',fr1:'#fff6e4',fr2:'#f4dcb2',ink:'#7a4522',lg:'#8a4a22',b1:'#fff4e0',b2:'#f6d7a4',bd:'#bf8f58',bi:'#8a5528',bn:'#ffd9b0',bnb:'#6d3a1d',bnk:'#6d3a1d',bts:'0 1px 0 rgba(255,255,255,.6)',brad:'28px 10px 28px 10px'}},
 {n:'Space',st:['#3d60c4','#3558b8'],ol:'#1f3a8f',bd:['#cde8ff','#b3d8fb'],tint:['#e8e0ff','#d0f0ff','#fff0c0'],dc:'rgba(70,100,200,.3)',lb:'#1f3a8f',hk:'swirl',ha:'#8da2ff',cup:['#d9f7e2','#7edcaa'],emo:['🚀','🪐','🛸','🌟','🌙'],ds:['🚀','🪐','🛸','🌟','🌙','☄️'],

 {n:'Ocean',st:['#12aca7','#16b4af'],ol:'#0a6f70',bd:['#daf6f2','#c4ede8'],tint:['#c2f0e8','#d6e8ff','#ffe6dc'],dc:'rgba(20,150,150,.3)',lb:'#0a6f70',hk:'dash',ha:'#0a6f70',cup:['#dcfff5','#78dcc6'],emo:['🐟','🐙','⭐','🐚','🦀'],ds:['🐟','🐙','🐬','🐚','🦀','⭐'],
  v:{t1:'#dcf6f3',t2:'#b6e9e5',t3:'#8dd6d2',s1:'#34bdb8',s2:'#18a3a2',s3:'#0e8689',sd:'#07555a',ov:'none',rad:'50px 50px 66px 66px',fr:'32px',fr1:'#e8fcf8',fr2:'#bdece4',ink:'#e6fffb',lg:'#ffffff',b1:'#f4fffc',b2:'#bfeee6',bd:'#5db6ac',bi:'#0e8689',bn:'#d6f5ef',bnb:'#14807b',bnk:'#ffffff',bts:'-1.5px -1.5px 0 #14807b,1.5px -1.5px 0 #14807b,-1.5px 1.5px 0 #14807b,1.5px 1.5px 0 #14807b,0 3px 0 #14807b',brad:'12px 12px 44px 44px'}},
 {n:'Dino',st:['#127c3f','#117f40'],ol:'#0a4a24',bd:['#c3f2d0','#a9e8bc'],tint:['#d8f5b8','#b4ecd4','#fff2b0'],dc:'rgba(20,120,60,.28)',lb:'#0a4a24',hk:'spark',ha:'#0a4a24',cup:['#fff8c4','#e6d45c'],emo:['🦖','🥚','🌋','🌿','🦕'],ds:['🦖','🥚','🌋','🌿','🦕','🌴'],
  v:{t1:'#dff7d6',t2:'#bdeab5',t3:'#97d68c',s1:'#3aa85a',s2:'#238a46',s3:'#176f35',sd:'#0a4a22',ov:'none',rad:'52px 44px 62px 62px',fr:'28px',fr1:'#fff6bd',fr2:'#f0e083',ink:'#ecffe2',lg:'#fff6b0',b1:'#fffcd6',b2:'#efe08e',bd:'#a89a3a',bi:'#176f35',bn:'#fff3a8',bnb:'#0d6a34',bnk:'#0b7a38',bts:'0 1px 0 rgba(255,255,255,.6)',brad:'30px 44px 30px 44px'}}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(st,t)=>{const p=t*(st.length-1),i=Math.min(st.length-2,p|0),f=p-i,a=hx(st[i]),b=hx(st[i+1]);return a.map((v,k)=>Math.round(v+(b[k]-v)*f))};
let M,th=THEMES[0],S=40,DPR=1;
const board=document.createElement('canvas'),rails=document.createElement('canvas');
let level=0,state='ready',time=0,started=false,drops=0,fall=null,sp=0,tr=null,railA=1,railY=0,parts=[];
let ball={x:0,y:0,vx:0,vy:0,s:1,z:0},tilt={x:0,y:0},keys={},drag=null,dev={x:0,y:0,live:false},cal=null;

/* ---------- maze generation (unchanged) ---------- */
function build(lv){
  const [cols,rows,nh]=LV[Math.min(lv,2)],extra=Math.max(0,lv-2)*2;
  const V=[],H=[];
  for(let i=0;i<=cols;i++)V[i]=Array(rows).fill(true);
  for(let i=0;i<cols;i++)H[i]=Array(rows+1).fill(true);
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  const open=(x,y,a,b)=>{if(a>x)V[x+1][y]=false;else if(a<x)V[x][y]=false;else if(b>y)H[x][y+1]=false;else H[x][y]=false};
  const wall=(x,y,a,b)=>a>x?V[x+1][y]:a<x?V[x][y]:b>y?H[x][y+1]:H[x][y];
  const seen=[...Array(cols)].map(()=>Array(rows).fill(false));
  const st=[[0,rows-1]];seen[0][rows-1]=true;
  while(st.length){
    const [x,y]=st[st.length-1];
    const nb=D.map(d=>[x+d[0],y+d[1]]).filter(([a,b])=>a>=0&&b>=0&&a<cols&&b<rows&&!seen[a][b]);
    if(!nb.length){st.pop();continue}
    const [a,b]=nb[Math.random()*nb.length|0];open(x,y,a,b);seen[a][b]=true;st.push([a,b]);
  }
  for(let n=Math.floor(cols*rows*.07);n>0;n--){
    if(Math.random()<.5)V[1+(Math.random()*(cols-1)|0)][Math.random()*rows|0]=false;
    else H[Math.random()*cols|0][1+(Math.random()*(rows-1)|0)]=false;
  }
  const sx=0,sy=rows-1,fx=cols-1,fy=0,prev={[sx+','+sy]:null},q=[[sx,sy]];
  for(let i=0;i<q.length;i++){const [x,y]=q[i];
    for(const [dx,dy] of D){const a=x+dx,b=y+dy;
      if(a<0||b<0||a>=cols||b>=rows||(a+','+b) in prev||wall(x,y,a,b))continue;
      prev[a+','+b]=[x,y];q.push([a,b]);}}
  const path=[];let c=[fx,fy];while(c){path.push(c);c=prev[c[0]+','+c[1]]}
  const onPath=new Set(path.map(p=>p.join()));
  const mid=path.slice(2,-2),others=[];
  for(let x=0;x<cols;x++)for(let y=0;y<rows;y++){
    if(onPath.has(x+','+y)||(Math.abs(x-sx)+Math.abs(y-sy)<2))continue;others.push([x,y]);}
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
  const total=nh+extra,np=Math.round(total*.4);
  const pick=[...shuf(mid).slice(0,np),...shuf(others).slice(0,total-Math.min(np,mid.length))];

function collide(){

    if(b.x<w.x-BR||b.x>w.x+w.w+BR||b.y<w.y-BR||b.y>w.y+w.h+BR)continue;
    const cx=clamp(b.x,w.x,w.x+w.w),cy=clamp(b.y,w.y,w.y+w.h);
    let dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;

    else{const l=b.x-w.x,r=w.x+w.w-b.x,t=b.y-w.y,bt=w.y+w.h-b.y,m=Math.min(l,r,t,bt);

    b.x+=nx*pen;b.y+=ny*pen;
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){b.vx-=(1+REST)*vn*nx;b.vy-=(1+REST)*vn*ny;imp=Math.max(imp,-vn)}

}

  const cells=[];for(let x=0;x<M.cols;x++)for(let y=0;y<M.rows;y++)if(!used.has(x+','+y)&&!(x===0&&y===M.rows-1)&&!(x===M.cols-1&&y===0))cells.push([x,y]);
  cells.sort(()=>Math.random()-.5);const ne=Math.round(M.cols*M.rows*.11);M.emo=cells.slice(0,ne).map(([x,y])=>({x:x+.5,y:y+.5,g:th.emo[Math.random()*th.emo.length|0]}));
  M.deco=cells.slice(ne,ne+Math.round(M.cols*M.rows*.18)).map(([x,y])=>({x:x+.5+(Math.random()-.5)*.14,y:y+.5+(Math.random()-.5)*.14,k:Math.random()*5|0,r:(Math.random()-.5)*.7}));
  fit();retry(true);
}
function retry(keep){
  ball={x:M.start.x,y:M.start.y,vx:0,vy:0,s:1,z:0};time=0;started=false;drops=0;fall=null;updHud();
  tip.textContent=dev.live?'Tilt to roll':'Drag to roll';tip.style.opacity=0;
  if(!keep){hideCard();spawn()}
}
function showCard(h){card.innerHTML=h;card.hidden=false;card.style.animation='none';void card.offsetWidth;card.style.animation='';dim.classList.add('on')}
function hideCard(){card.hidden=true;dim.classList.remove('on')}
function intro(){
  state='ready';retry(true);
  showCard(`<h2>POCKET MAZE</h2><div class="sub">PM-01</div><button class="pill y" id="go">PLAY</button>`);
  $('#go').onclick=play;
}
function transition(cb){if(tr)return;hideCard();state='trans';tr={t:0,cb}}
async function enableTilt(){
  if(typeof DeviceOrientationEvent==='undefined')return;
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    try{if(await DeviceOrientationEvent.requestPermission()!=='granted')return}catch(e){return}
  }
  if(!enableTilt.on){enableTilt.on=true;addEventListener('deviceorientation',onOri)}
}
function onOri(e){
  if(e.gamma==null||e.beta==null)return;
  if(!dev.live){dev.live=true;tip.textContent='Tilt to roll'}
  if(!cal)cal=[e.gamma,e.beta];
  const a=(screen.orientation&&screen.orientation.angle)||0;
  const dg=e.gamma-cal[0],db=e.beta-cal[1];
  let x=dg,y=db;
  if(a===90){x=db;y=-dg}else if(a===270){x=-db;y=dg}else if(a===180){x=-dg;y=-db}
  const dz=v=>Math.abs(v)<1.5?0:v;
  dev.x=clamp(dz(x)/22,-1,1);dev.y=clamp(dz(y)/22,-1,1);
}
async function play(){audio();await enableTilt();cal=null;hideCard();retry();tap(3)}
function showWin(){
  showCard(`<h2>★ MAZE CLEARED ★</h2><div class="big">${fmt(time)}</div><div class="sub">${drops} ${drops===1?'DROP':'DROPS'}</div><button class="pill y" id="nx">NEXT MAZE</button><button class="pill" id="pa">PLAY AGAIN</button>`);
  $('#nx').onclick=()=>{tap(3);transition(()=>{level++;reset()})};
  $('#pa').onclick=()=>{tap(3);retry()};
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();if(k.startsWith('arrow'))e.preventDefault();
  keys[k]=true;if(state==='ready'&&(k==='enter'||k===' '))play();
});
addEventListener('keyup',e=>{delete keys[e.key.toLowerCase()]});
addEventListener('blur',()=>{keys={};drag=null});
$('#stage').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={ax:e.clientX,ay:e.clientY,cx:e.clientX,cy:e.clientY}});
addEventListener('pointermove',e=>{if(drag){drag.cx=e.clientX;drag.cy=e.clientY}});
addEventListener('pointerup',()=>drag=null);
addEventListener('pointercancel',()=>drag=null);
$('#bNew').onclick=()=>{audio();if(state==='trans')return;tap(3);vib(8);transition(()=>reset())};
$('#bSnd').onclick=e=>{audio();soundOn=!soundOn;if(out)out.gain.value=soundOn?1:0;e.currentTarget.classList.toggle('off',!soundOn);tap(3)};
$('#bHome').onclick=()=>{audio();if(state==='trans')return;tap(3);vib(8);intro()};
addEventListener('resize',()=>{fit()});

/* ---------- loop ---------- */
let last=0;
function loop(t){
  const dt=Math.min((t-last)/1000||0,1/30);last=t;
  step(dt);updHud();draw();
  toy.style.transform=`perspective(1100px) rotateX(${-tilt.y*2.5}deg) rotateY(${tilt.x*2.5}deg)`;
  $('#shadow').style.transform=`translate(${-tilt.x*12}px,${-tilt.y*6}px) scale(${1+tilt.x*.03})`;
  glare.style.backgroundPosition=`0 0,0 0,${50+tilt.x*40}% 50%`;
  requestAnimationFrame(loop);
}
reset();intro();requestAnimationFrame(loop);
</script>
</body></html>
