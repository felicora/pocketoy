 case 4:ctx.fillStyle='#f6b95c';rr(-s*1.1,-s*.2,s*2.2,s*1.1,3);ctx.fill();ctx.fillStyle='#e89a3c';ctx.beginPath();ctx.arc(0,-s*.2,s*1.1,Math.PI,0);ctx.fill();ctx.fillStyle='#fff2a8';rr(-s*.2,-s*.35,s*.4,s*.55,2);ctx.fill();break;
 case 5:ctx.fillStyle='#ffb3d1';for(let i=0;i<5;i++){circ(Math.cos(i*TAU/5)*s*.7,Math.sin(i*TAU/5)*s*.7,s*.5);ctx.fill()}ctx.fillStyle='#ffe27a';circ(0,0,s*.4);ctx.fill();break;
 default:ctx.strokeStyle='rgba(255,255,255,.8)';ctx.fillStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.3;for(const[x,y,r]of[[-.6,0,.6],[.5,-.3,.45],[0,.7,.35]]){circ(x*s,y*s,r*s);ctx.fill();ctx.stroke()}}}
function drawDecos(){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=5;ctx.lineCap='round';for(let k=0;k<6;k++){ctx.beginPath();ctx.arc(0,0,R*.9,k*1.047,k*1.047+.3);ctx.stroke()}
 for(const o of decos){const al=clamp(Math.sin(T*o.p+o.ph)*2+.8,0,1);if(al<.02)continue;ctx.save();ctx.globalAlpha=al*.9;ctx.translate(Math.cos(o.a)*o.r,Math.sin(o.a)*o.r);ctx.rotate(o.ph-rot*.5);deco(o.t,R*.08*o.s);ctx.restore()}

function drawBanner(){const t=introT-2.4;if(t<0||t>2.4||state!=='play')return;ctx.save();ctx.globalAlpha=Math.min(1,t*3,(2.4-t)*2);ctx.translate(cx,cy-R*.35+(1-Math.min(1,t*3))*10);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 30px '+FONT;ctx.lineJoin='round';ctx.lineWidth=7;ctx.strokeStyle='rgba(20,110,170,.55)';ctx.strokeText('Catch all '+GOAL+'!',0,0);ctx.fillStyle='#fff';ctx.fillText('Catch all '+GOAL+'!',0,0);ctx.restore()}
const GL={M:['M1 11V1L4 7L7 1V11',8],A:['M1 11L4 1L7 11M2.3 8H5.7',8],G:['M7 2.8C6 .6 1 .5 1 6C1 11.5 6.5 11.7 7 7.4H4.3',8],N:['M1 11V1L7 11V1',8],E:['M7 1H1V11H7M1 6H5.5',8],T:['M.5 1H7.5M4 1V11',8],F:['M7 1H1V11M1 6H5.5',8],I:['M1.5 1V11',3],S:['M7 2.5C6.5 .5 1 .5 1 3.5C1 6.5 7 5.5 7 8.5C7 11.5 1.5 11.5 1 9.5',8],H:['M1 1V11M7 1V11M1 6H7',8]};
for(const k in GL)GL[k][2]=new Path2D(GL[k][0]);
function drawLogo(mx,cyl,maxW){
 const gap=2.2,sp=5,words=[['MAGNET','#6c8bf2','#3a50ab'],['FISHING','#ff7aa8','#cf3577']],items=[];let x=0;
 words.forEach(w=>{for(const ch of w[0]){const g=GL[ch];items.push({g,x,c:w[1],d:w[2],i:items.length});x+=g[1]+gap}x+=sp-gap});x-=sp;
 const sc=Math.min(maxW/x,1.7),L=[[4.4,()=>'rgba(150,60,100,.28)',.5,.9],[4.2,()=>'#fff',0,0],[3.2,it=>it.d,0,0],[2.2,it=>it.c,0,0],[.7,()=>'rgba(255,255,255,.75)',-.35,-.5]];
 ctx.save();ctx.translate(mx-x*sc/2,cyl-6*sc);ctx.scale(sc,sc);ctx.lineCap='round';ctx.lineJoin='round';
 for(const[lw,col,ox,oy]of L){ctx.lineWidth=lw;for(const it of items){ctx.save();ctx.translate(it.x+it.g[1]/2+ox,6+oy+Math.sin(T*2.2+it.i*.6)*.35);ctx.rotate(((it.i*37%7)-3)*.012);ctx.translate(-it.g[1]/2,-6);ctx.strokeStyle=col(it);ctx.stroke(it.g[2]);ctx.restore()}}
 ctx.restore()}
function drawFly(){for(const f of fish)if(f.state==='fly'){const t=Math.min(1,f.ft),e=t*t*(3-2*t);drawFish(f,f.fx,f.fy,-Math.PI/2*(1-e)+Math.sin(t*6)*.25,1.45+(ts-1.45)*e,1,1.4)}}
function drawParts(){for(const p of parts){const a=1-p.l/p.m;ctx.globalAlpha=Math.max(0,Math.min(1,a*1.5));
 if(p.k==='t'){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 24px '+FONT;ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='#fff';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle='#ffb300';ctx.fillText(p.txt,p.x,p.y)}
 else if(p.k==='d'){ctx.fillStyle='#e8fdff';circ(p.x,p.y,p.r);ctx.fill()}
 else if(p.k==='c'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+p.l*5);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()}
 else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.l*4);ctx.fillStyle=p.c;ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?p.r*.35:p.r*(.6+.4*a),an=i*Math.PI/4;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r)}ctx.closePath();ctx.fill();ctx.restore()}}ctx.globalAlpha=1}
function drawWin(dt){
 overlayT+=dt;const t=Math.min(1,overlayT*2.4),s=1+2.70158*(t-1)**3+1.70158*(t-1)**2;
 const cw=Math.min(W-70,250),ch=176,x=(W-cw)/2,y=cy-ch/2;ovF=true;
 ctx.save();ctx.translate(W/2,cy);ctx.scale(s,s);ctx.translate(-W/2,-cy);
 ctx.save();ctx.shadowColor='rgba(100,30,70,.4)';ctx.shadowBlur=22;ctx.shadowOffsetY=8;let g=ctx.createLinearGradient(0,y,0,y+ch);g.addColorStop(0,'#fffaf0');g.addColorStop(1,'#ffe3ee');ctx.fillStyle=g;rr(x,y,cw,ch,32);ctx.fill();ctx.restore();
 ctx.strokeStyle='#fff';ctx.lineWidth=4;rr(x+2,y+2,cw-4,ch-4,30);ctx.stroke();
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 21px '+FONT;emboss('PERFECT CATCH!',W/2,y+34,SH.tx);ctx.font='600 17px '+FONT;emboss(GOAL+' / '+GOAL+' FISH',W/2,y+66,'#5f9fd8');star5(W/2,y+90,9,'#ffd75e',0);star5(W/2-24,y+94,5.5,'#ffb3d1',.3);star5(W/2+24,y+94,5.5,'#9be8ff',-.3);
 const bw=(cw-44)/2,by=y+112;btn('again',x+16,by,bw,46,23,'#ff9ec4','#e0709f','PLAY AGAIN','700 13px '+FONT);btn('toy',x+28+bw,by,bw,46,23,SH.ac,'#b08fdd','NEXT TOY','700 13px '+FONT);
 ctx.restore();ovF=false;
}
function drawToast(dt){if(!toast)return;toast.t-=dt;if(toast.t<=0){toast=null;return}ctx.font='600 15px '+FONT;const w=ctx.measureText(toast.m).width+36;ctx.globalAlpha=Math.min(1,toast.t*3);ctx.fillStyle='#fff';rr(W/2-w/2,H-casing.y-100,w,38,19);ctx.fill();ctx.fillStyle='#d4558a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(toast.m,W/2,H-casing.y-81);ctx.globalAlpha=1}
const say=m=>toast={m,t:2.2};
/* ---------- input ---------- */
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
const hit=p=>(state==='win'?ui.filter(b=>b.ov):ui.filter(b=>!b.ov)).find(b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h+6);
function setTgt(p){const vx=p.x-cx,vy=p.y+(ptr.type==='touch'?-52:0)-cy,di=Math.hypot(vx,vy),lim=R-14,s=di>lim?lim/di:1;tgt.x=cx+vx*s;tgt.y=cy+vy*s}
function act(id){
 if(id==='snd'||id==='snd2'){muted=!muted;if(!muted)sfx.tap()}else if(id==='rst'||id==='again')reset(false);
 else if(id==='share'){const text='🎣 Perfect Catch! I caught all '+GOAL+' fish in Magnet Fishing (Pocket Toys). Drop. Catch. Reel!';
  (async()=>{try{if(navigator.share){await navigator.share({title:'Magnet Fishing',text,url:location.href})}else{await navigator.clipboard.writeText(text+' '+location.href);say('Copied to clipboard!')}}catch(e){}})()}
 else if(id==='toy')reset();else if(id==='home'||id==='home2')say('More Pocket Toys coming soon! 🧸');
}
cv.addEventListener('pointerdown',e=>{ac();const p=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
 const b=hit(p);if(b){pressed=b.id;sfx.tap();return}if(state!=='play'||introT<2.4)return;
 ptr={down:true,x:p.x,y:p.y,t:0,dist:0,type:e.pointerType,lx:tgt.x,ly:tgt.y};setTgt(p);stillT=0});
cv.addEventListener('pointermove',e=>{if(pressed||!ptr.down)return;const p=pos(e);ptr.dist+=Math.hypot(p.x-ptr.x,p.y-ptr.y);const dy=ptr.y-p.y;if(dy>0)reel(dy);ptr.x=p.x;ptr.y=p.y;setTgt(p)});
const up=e=>{const p=pos(e);if(pressed){const b=hit(p);if(b&&b.id===pressed)act(pressed);pressed=null;return}
 if(ptr.down){if(ptr.t<.28&&ptr.dist<14&&!hooked&&state==='play')tapT=.55;ptr.down=false}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{pressed=null;ptr.down=false});
/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 ctx.setTransform(DPR,0,0,DPR,0,0);ui=[];update(dt);
 ctx.save();drawCase();drawHeader();drawPond();drawTray();drawBtns();drawRod();drawFly();drawParts();drawBanner();ctx.restore();
 if(state==='win')drawWin(dt);drawToast(dt);requestAnimationFrame(frame)}
if(document.fonts&&document.fonts.load)document.fonts.load('700 20px Fredoka').catch(()=>{});document.fonts.load('14px "Patrick Hand"').catch(()=>{});
resize();[mag,tip,tgt].forEach(p=>{p.x=cx;p.y=cy});tip.y=cy-96;reset();
addEventListener('resize',resize);requestAnimationFrame(frame);
