<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e4c8">
<title>POCKETOY · Tiny toys. Big memories.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#5a3446;--pink:#f6a8ba;--mint:#98e0cb;--mint2:#6fc2ac;--cream:#fff3d8;--butter:#ffe9a8;--yel:#ffd75e;--lav:#c9b8f2;--u:2px;--font:"Baloo 2","Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(120% 90% at 50% 40%,#fbefd9 0%,#f3e2c4 100%);display:grid;place-items:center;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.grain{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.11;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .2  0 0 0 .9 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.stage{position:relative;width:min(100vw,calc(100dvh / 2));aspect-ratio:1/2;user-select:none;-webkit-user-select:none}
.stage>svg.art{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 calc(var(--u)*6) 0 rgba(90,52,70,.13))}
.stage>*{position:absolute}
.stage>svg.art{position:absolute}
/* LEDs */
.led{animation:led 6s steps(1) infinite}.led.b{animation-delay:-3s}
@keyframes led{0%{fill:#ffd75e}33%{fill:#8fe0c8}66%{fill:#f6a8ba}}
/* glass */
.glass{left:12%;top:19.75%;width:76%;height:49.5%;border-radius:calc(var(--u)*14);overflow:hidden;pointer-events:none;z-index:7}
.glass i{position:absolute;top:-10%;left:-40%;width:22%;height:130%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-18deg);animation:refl 9s ease-in-out infinite}
.glass i+i{width:6%;animation-delay:.25s;opacity:.7}
@keyframes refl{0%,55%{left:-40%}100%{left:130%}}
.reduce .glass i{animation:none;left:8%}
/* toys */
.toy{z-index:5;transform:rotate(var(--r));transition:transform .22s cubic-bezier(.3,1.7,.5,1),opacity .3s,filter .3s;outline:none}
.toy .art{display:block;position:relative}
.toy img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.toy .sh{position:absolute;left:-8%;right:-8%;bottom:-5%;height:11%;border-radius:50%;background:radial-gradient(closest-side,rgba(90,52,70,.28),rgba(90,52,70,0));transition:opacity .3s}
.toy.sel{transform:rotate(var(--r)) translateY(calc(var(--u)*-5)) scale(1.07)}
.toy:focus-visible::after{content:"";position:absolute;inset:-6%;border:3px dashed var(--ink);border-radius:18%}
.picking .toy:not(.sel){opacity:.5;filter:saturate(.35)}
.picking .toy.sel{z-index:9}
/* wake animations */
.bub{position:absolute;border:1.5px solid #fff;background:rgba(255,255,255,.4);border-radius:50%;opacity:0;width:7%;aspect-ratio:1;bottom:42%}
.b1{left:30%}.b2{left:55%;width:5%}.b3{left:72%;width:6%}
.wake .bub{animation:rise 1.5s ease-out}.wake .b2{animation-delay:.25s}.wake .b3{animation-delay:.5s}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-90px) scale(1.3)}}
.wl.wake .art{animation:rock 1s ease-in-out}
@keyframes rock{25%{transform:rotate(-2deg) translateY(-2%)}55%{transform:rotate(1.6deg) translateY(1%)}80%{transform:rotate(-.6deg)}}
.rip{position:absolute;left:50%;top:50%;width:50%;aspect-ratio:1;border:2px solid rgba(255,255,255,.9);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.2)}
.wake .rip{animation:rip 1.3s ease-out}.wake .rip+.rip{animation-delay:.3s}
@keyframes rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.mf.wake .art{animation:wob 1.1s ease-in-out}
@keyframes wob{30%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}}
.pm.wake .art{animation:tilt 1.3s ease-in-out;transform-origin:50% 60%}
@keyframes tilt{30%{transform:rotate(4deg)}65%{transform:rotate(-3deg)}}
.mar{position:absolute;left:30%;top:30%;width:7%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aab6c4 55%,#5b6775);opacity:0}
.wake .mar{animation:mar 1.3s ease-in-out}
@keyframes mar{0%{opacity:0}15%,85%{opacity:1}0%,100%{transform:translate(0,0)}45%{transform:translate(120%,260%)}100%{transform:translate(300%,120%);opacity:0}}
.lc.wake .art{animation:jig .9s ease-in-out}
@keyframes jig{12%{transform:translate(-2%,-1%) rotate(-2.4deg)}28%{transform:translate(2%,0) rotate(2.4deg)}44%{transform:translate(-2%,-1%) rotate(-1.8deg)}60%{transform:translate(1.5%,0) rotate(1.5deg)}80%{transform:rotate(-.5deg)}}
.lcd{position:absolute;container-type:inline-size;background:#b9e58f;border-radius:4%;opacity:0;transition:opacity .08s;overflow:hidden}
.lcd i{position:absolute;left:50%;top:50%;width:1em;height:1em;font-size:6.5cqw;margin:-3em 0 0 -2.5em}
.ph.wake .lcd{opacity:.95}.ph.wake .lcd i{animation:beat .5s steps(2) infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.reduce .toy .art,.reduce .bub,.reduce .rip,.reduce .mar{animation:none!important}
/* label */
.lab{z-index:12;pointer-events:none;background:var(--cream);border:calc(var(--u)*1.6) solid var(--ink);border-radius:calc(var(--u)*14);padding:calc(var(--u)*2) calc(var(--u)*10);text-align:center;line-height:1.05;white-space:nowrap;opacity:0;transform:translate(-50%,-100%) scale(.85);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1);box-shadow:0 calc(var(--u)*2) 0 rgba(90,52,70,.18)}
.lab.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.lab.below{transform:translate(-50%,0) scale(.85)}.lab.below.on{transform:translate(-50%,0) scale(1)}
.lab b{display:block;font-weight:800;font-size:max(12px,calc(var(--u)*10));letter-spacing:.04em}
.lab span{display:block;font-weight:700;font-size:max(11px,calc(var(--u)*8.5));color:#b4637f}
/* claw */
.claw{z-index:6;left:0;top:calc(var(--u)*164);width:calc(var(--u)*66);margin-left:calc(var(--u)*-33);pointer-events:none;--a:4deg}
.claw svg{display:block;width:100%;overflow:visible}
.claw .cable{width:calc(var(--u)*5);margin:0 auto;height:calc(var(--u)*8);background:var(--mint);border:calc(var(--u)*1.5) solid var(--ink);border-top:0;border-bottom:0}
.claw .hang{transform-origin:50% 0;animation:sway 5.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.claw.seq .hang,.reduce .claw .hang{animation:none}
.claw.open{--a:15deg}.claw.closed{--a:-17deg}
.claw .arm{transition:transform .14s;transform-origin:0 0}
.claw .aL{transform:rotate(var(--a))}.claw .aR{transform:rotate(calc(var(--a)*-1))}
.clack{z-index:14;pointer-events:none;font-weight:800;font-size:calc(var(--u)*22);color:#fff;-webkit-text-stroke:calc(var(--u)*4) var(--ink);paint-order:stroke fill;opacity:0;transform:translate(-50%,-50%) rotate(-8deg)}
.clack.go{animation:clack .55s ease-out}
@keyframes clack{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.4)}25%{opacity:1;transform:translate(-50%,-70%) rotate(-8deg) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110%) rotate(-8deg) scale(1)}}
/* controls */
.ctl{z-index:10;width:calc(var(--u)*44);height:calc(var(--u)*44);border-radius:50%;border:calc(var(--u)*3) solid var(--ink);box-shadow:0 calc(var(--u)*4) 0 #b8708a,inset 0 calc(var(--u)*-3) 0 rgba(0,0,0,.08),inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.5);transition:transform .08s,box-shadow .08s;display:grid;place-items:center}
.ctl:active{transform:translateY(calc(var(--u)*4));box-shadow:0 0 0 #b8708a,inset 0 calc(var(--u)*2) 0 rgba(0,0,0,.1)}
.ctl svg{width:56%;height:56%;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ctl.off{filter:saturate(.4);opacity:.85}.ctl.off::after{content:"";position:absolute;width:62%;height:calc(var(--u)*3);background:var(--ink);border-radius:3px;transform:rotate(-45deg)}
.ctl:focus-visible,.close:focus-visible,.sw:focus-visible,.home:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.chute-bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.03,.97)}}
/* game layer */
.game{position:fixed;inset:0;z-index:40;background:var(--cream);visibility:hidden}
.game.on{visibility:visible}
.game iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream)}
.home{position:absolute;z-index:45;left:50%;top:env(safe-area-inset-top,0px);transform:translateX(-50%);height:30px;padding:0 14px 0 10px;border:2px solid var(--ink);border-top:0;border-radius:0 0 16px 16px;background:rgba(255,248,232,.95);font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(90,52,70,.18)}
.home svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.portal{position:fixed;z-index:60;display:none;background:#4a2f45;border:4px solid var(--mint);box-shadow:inset 0 10px 0 rgba(0,0,0,.18);overflow:hidden}
.portal .dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .3s}.portal.wait .dots{opacity:1}
.dots b{display:inline-block;width:12px;height:12px;margin:0 4px;border-radius:50%;background:var(--pink);animation:dt 1s infinite}
.dots b:nth-child(2){background:var(--mint);animation-delay:.15s}.dots b:nth-child(3){background:var(--yel);animation-delay:.3s}
@keyframes dt{40%{transform:translateY(-9px)}}
/* about */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(90,52,70,.35);opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.about{position:fixed;z-index:81;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(92vw,380px);transform:translate(-50%,120%);background:var(--cream);border:3px solid var(--ink);border-radius:28px;padding:18px 20px 16px;text-align:center;transition:transform .3s cubic-bezier(.3,1.3,.5,1);box-shadow:0 6px 0 rgba(90,52,70,.2)}
.about.on{transform:translate(-50%,0)}
.about h3{margin:0;font-size:26px;font-weight:800;letter-spacing:.06em;color:#ef7aa0;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.about p{margin:6px 0 12px;font-size:16px;line-height:1.3;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;padding:8px 0;border-top:2px dashed rgba(90,52,70,.2)}
.sw{width:56px;height:32px;border-radius:16px;border:3px solid var(--ink);background:#d9c7b3;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);transition:left .15s}
.sw.on{background:var(--mint)}.sw.on::after{left:26px}
.close{margin-top:10px;width:100%;height:46px;border-radius:23px;border:3px solid var(--ink);background:var(--yel);font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(90,52,70,.25)}
.close:active{transform:translateY(3px);box-shadow:none}
</style>
</head>

 wl(){[0,.15,.3].forEach((d,i)=>tone(500+i*160,900+i*160,.09,'sine',.05,d))},mf(){tone(700,1100,.12,'sine',.06);tone(500,800,.1,'sine',.04,.14)},pm(){[0,.12,.26,.4].forEach(d=>noise(.06,.05,d,600))},lc(){[0,.09,.18,.27,.36].forEach(d=>noise(.05,.07,d,1500))},ph(){tone(1500,1500,.08,'square',.035);tone(1900,1900,.1,'square',.035,.12)}};
/* ---------- build toys ---------- */
const heart=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
function heartShadow(){const c=[];heart.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==='X')c.push([x,y])}));const [ax,ay]=c[0];return c.slice(1).map(([x,y])=>`${x-ax}em ${y-ay}em 0 #3b4d2a`).join(',')}
const toys={};
CFG.forEach(c=>{const m=IMGS[c.id];c.h=c.w/m.r;const el=document.createElement('button');el.className='toy '+c.cls;el.dataset.id=c.id;el.setAttribute('aria-label',c.name);
 el.style.cssText=`left:${(c.cx-c.w/2)/4}%;top:${(c.b-c.h)/8}%;width:${c.w/4}%;--r:${c.rot}deg`;
 let fx='';if(c.cls==='wl')fx='<span class="bub b1"></span><span class="bub b2"></span><span class="bub b3"></span>';
 if(c.cls==='mf')fx='<span class="rip"></span><span class="rip"></span>';if(c.cls==='pm')fx='<span class="mar"></span>';
 if(c.cls==='ph'){const l=m.lcd;fx=`<span class="lcd" style="left:${l[0]*100}%;top:${l[1]*100}%;width:${l[2]*100}%;height:${l[3]*100}%"><i style="background:#3b4d2a;box-shadow:${heartShadow()}"></i></span>`}
 el.innerHTML=`<span class="sh"></span><span class="art"><img src="${m.src}" alt="" draggable="false">${fx}</span>`;
 stage.insertBefore(el,$('.glass'));c.el=el;toys[c.id]=c});
function place(){if(sel)moveFollow()}
/* ---------- claw follow ---------- */
let cx=200*U,tx=200*U,sel=null,busy=false,seq=false,pt='mouse',kb=false;
function setClaw(x){claw.style.transform=`translateX(${x}px)`}
function loop(){if(!seq){cx+=(tx-cx)*(S.reduce?1:.13);setClaw(cx)}requestAnimationFrame(loop)}
function clampX(x){return Math.max(78*U,Math.min(322*U,x))}
function moveFollow(){tx=sel?toys[sel].cx*U:200*U}
stage.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!sel&&!busy){tx=clampX(e.clientX-stage.getBoundingClientRect().left)}});
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!busy){select(null)}});
setClaw(cx);loop();
/* ---------- selection ---------- */
function wake(id,sound){const el=toys[id].el;el.classList.remove('wake');void el.offsetWidth;el.classList.add('wake');if(sound&&SFX[toys[id].cls])SFX[toys[id].cls]();clearTimeout(el._w);el._w=setTimeout(()=>el.classList.remove('wake'),1800)}
function showLab(id,touch){const c=toys[id];lab.innerHTML=`<b>${c.name}</b><span>${touch?'Tap again to play':'PLAY'}</span>`;
 const below=c.b>470;lab.classList.toggle('below',below);const top=below?c.b*U+5*U:(c.b-c.h)*U-4*U;lab.style.top=top+'px';lab.classList.add('on');const w=lab.offsetWidth;lab.style.left=Math.max(w/2+4*U,Math.min(400*U-w/2-4*U,c.cx*U))+'px'}
function select(id,touch){if(busy)return;if(sel&&sel!==id)toys[sel].el.classList.remove('sel');sel=id;
 if(!id){lab.classList.remove('on');moveFollow();return}
 toys[id].el.classList.add('sel');moveFollow();showLab(id,touch);wake(id,true)}
CFG.forEach(c=>{const el=c.el;
 el.addEventListener('pointerenter',e=>{pt=e.pointerType;if(e.pointerType==='mouse')select(c.id,false)});
 el.addEventListener('pointerdown',e=>{pt=e.pointerType;kb=false});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')kb=true});
 el.addEventListener('focus',()=>{if(el.matches(':focus-visible'))select(c.id,false)});
 el.addEventListener('click',e=>{if(busy)return;const direct=pt==='mouse'||kb;kb=false;
  if(direct||sel===c.id){launch(c.id)}else select(c.id,true)});
});
document.addEventListener('pointerdown',e=>{if(!busy&&sel&&pt!=='mouse'&&!e.target.closest('.toy,.ctl')&&e.pointerType!=='mouse')select(null)},true);
setInterval(()=>{if(!busy&&!sel&&!document.hidden&&!S.reduce){const c=CFG[Math.floor(Math.random()*CFG.length)];wake(c.id,false)}},4800);
/* ---------- animation helpers ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function A(el,kf,ms,ease='ease-in-out'){const a=el.animate(kf,{duration:ms,easing:ease,fill:'forwards'});return a.finished.then(()=>{try{a.commitStyles()}catch(e){}a.cancel()})}
const px=n=>n+'px';
function popClack(x,y){const c=$('#clack');c.style.left=x+'px';c.style.top=y+'px';c.classList.remove('go');void c.offsetWidth;c.classList.add('go')}
/* ---------- launch ---------- */
let current=null,loadP=null;
function startLoad(c){const f=document.createElement('iframe');f.title=c.name;f.allow='autoplay; fullscreen; accelerometer; gyroscope';
 loadP=new Promise(res=>{f.addEventListener('load',()=>res());setTimeout(res,9000)});f.src=c.src;game.prepend(f)}
function chuteRect(){const r=stage.getBoundingClientRect();return{l:r.left+78*U,t:r.top+698*U,w:244*U,h:60*U,rad:24*U}}
async function portalOpen(ms){const r=chuteRect();portal.style.cssText=`display:block;left:${r.l}px;top:${r.t}px;width:${r.w}px;height:${r.h}px;border-radius:${r.rad}px`;
 if(S.reduce){portal.style.cssText='display:block;left:0;top:0;width:100vw;height:100dvh;border-radius:0;opacity:0';await A(portal,[{opacity:0},{opacity:1}],220,'ease');return}
 SFX.thunk();await A(portal,[{left:px(r.l),top:px(r.t),width:px(r.w),height:px(r.h),borderRadius:px(r.rad)},{left:'0px',top:'0px',width:'100vw',height:'100dvh',borderRadius:'0px'}],ms,'cubic-bezier(.6,0,.25,1)')}
async function launch(id){if(busy)return;busy=true;sfxUnlock();const c=toys[id];startLoad(c);lab.classList.remove('on');stage.classList.add('picking');c.el.classList.add('sel');
 const first=!sessionStorage.getItem('pt:claw');sessionStorage.setItem('pt:claw','1');
 const tcx=c.cx*U,top=c.b-c.h,len=Math.max(REST,top-217)*U;seq=true;claw.classList.add('seq');
 const base=`rotate(${c.rot}deg)`,el=c.el;el.style.zIndex=9;c.el.querySelector('.sh').style.opacity=0;
 try{
 if(S.reduce){cx=tcx;setClaw(cx);claw.classList.add('open');await sleep(120);claw.classList.remove('open');claw.classList.add('closed');SFX.clack();await sleep(260);await portalOpen()}
 else if(first){
  await A(el,[{transform:base+' translateY(0) scale(1.07)'},{transform:base+` translateY(${-9*U}px) scale(1.12)`},{transform:base+' scale(1.07)'}],260);
  SFX.move();claw.classList.add('open');SFX.open();await A(claw,[{transform:`translateX(${cx}px)`},{transform:`translateX(${tcx}px)`}],560,'cubic-bezier(.5,0,.2,1)');cx=tcx;
  await A(cable,[{height:px(REST*U)},{height:px(len)}],430,'cubic-bezier(.5,0,.8,.6)');
  claw.classList.remove('open');claw.classList.add('closed');SFX.clack();popClack(tcx,(164+14+len/U+30)*U);
  await A(el,[{transform:base+' scale(1.07)'},{transform:`rotate(${c.rot+3}deg) scale(1.05)`},{transform:`rotate(${c.rot-3}deg) scale(1.07)`},{transform:base+' scale(1.07)'}],180);
  const lift=44*U;await Promise.all([A(cable,[{height:px(len)},{height:px(len-lift)}],320),A(el,[{transform:base+' scale(1.07)'},{transform:`translateY(${-lift}px) ${base} scale(1.07)`}],320)]);
  const dx=200*U-tcx;SFX.move();await Promise.all([A(claw,[{transform:`translateX(${tcx}px)`},{transform:`translateX(${200*U}px)`}],480,'ease-in-out'),A(el,[{transform:`translateY(${-lift}px) ${base} scale(1.07)`},{transform:`translate(${dx*.5}px,${-lift}px) rotate(${c.rot+9}deg) scale(1.07)`},{transform:`translate(${dx}px,${-lift}px) rotate(${c.rot-4}deg) scale(1.07)`}],480)]);cx=200*U;
  claw.classList.remove('closed');claw.classList.add('open');SFX.open();SFX.whoop();
  const toyCY=(c.b-c.h/2)*U-lift,dy=722*U-toyCY;
  A(cable,[{height:px(len-lift)},{height:px(REST*U)}],420);claw.classList.remove('open');
  await A(el,[{transform:`translate(${dx}px,${-lift}px) rotate(${c.rot-4}deg) scale(1.07)`},{transform:`translate(${dx}px,${dy}px) rotate(${c.rot+160}deg) scale(.5)`,opacity:1},{transform:`translate(${dx}px,${dy+6*U}px) rotate(${c.rot+170}deg) scale(.4)`,opacity:0}],560,'cubic-bezier(.55,0,1,.7)');
  await portalOpen(400);
 }else{
  claw.classList.add('open');SFX.open();SFX.move();
  await Promise.all([A(el,[{transform:base+' scale(1.07)'},{transform:base+` translateY(${-6*U}px) scale(1.11)`},{transform:base+' scale(1.07)'}],170),A(claw,[{transform:`translateX(${cx}px)`},{transform:`translateX(${tcx}px)`}],170,'cubic-bezier(.3,0,.1,1)')]);cx=tcx;
  await A(cable,[{height:px(REST*U)},{height:px(len)}],210,'cubic-bezier(.5,0,.9,.5)');
  claw.classList.remove('open');claw.classList.add('closed');SFX.clack();popClack(tcx,(164+14+len/U+30)*U);
  const dn=34*U;await Promise.all([A(cable,[{height:px(len)},{height:px(len+dn)}],160),A(el,[{transform:base+' scale(1.07)'},{transform:`translateY(${dn}px) ${base} scale(.9)`,opacity:.0}],160)]);
  await portalOpen(280);
 }}catch(e){console.error(e)}
 await Promise.race([loadP,sleep(9000)]);
 if(!S.reduce)portal.classList.remove('wait');
 game.classList.add('on');bgm.pause();current=c;history.pushState({g:id},'');
 await A(portal,[{opacity:1},{opacity:0}],240,'ease');portal.style.cssText='';
}
function sfxUnlock(){ac()}
/* waiting dots if the game is slow */
/* ---------- home ---------- */
async function goHome(fromPop){if(!current)return;const c=current;current=null;
 portal.style.cssText='display:block;left:0;top:0;width:100vw;height:100dvh;border-radius:0;opacity:0';await A(portal,[{opacity:0},{opacity:1}],S.reduce?160:200,'ease');
 const f=game.querySelector('iframe');game.classList.remove('on');if(f){f.src='about:blank';f.remove()}
 /* reset hub: toy is back in the machine, claw at rest */
 seq=false;claw.classList.remove('seq','open','closed');cable.style.height='';stage.classList.remove('picking');
 CFG.forEach(t=>{t.el.getAnimations().forEach(a=>a.cancel());t.el.style.transform='';t.el.style.opacity='';t.el.style.zIndex='';t.el.classList.remove('sel','wake');t.el.querySelector('.sh').style.opacity=''});
 claw.getAnimations().forEach(a=>a.cancel());cx=200*U;tx=cx;setClaw(cx);sel=null;busy=false;
 if(!fromPop&&history.state&&history.state.g)history.back();
 if(S.reduce){await A(portal,[{opacity:1},{opacity:0}],200)}else{const r=chuteRect();SFX.thunk();await A(portal,[{left:'0px',top:'0px',width:'100vw',height:'100dvh',borderRadius:'0px'},{left:px(r.l),top:px(r.t),width:px(r.w),height:px(r.h),borderRadius:px(r.rad),opacity:1}],300,'cubic-bezier(.6,0,.25,1)');await A(portal,[{opacity:1},{opacity:0}],120)}
 portal.style.cssText='';$('.stage').classList.remove('picking');startMusic()}
$('#home').onclick=()=>goHome();
addEventListener('popstate',()=>{if(current)goHome(true)});
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#about').classList.contains('on'))aboutSheet(false);else goHome()}});
addEventListener('message',e=>{if(e.data==='pocket-toys:home'||e.data==='pocketoy:home')goHome()});
addEventListener('pageshow',e=>{if(e.persisted&&!current)busy=false});
/* ---------- controls ---------- */
function startMusic(){if(S.music&&!current&&bgm.paused){bgm.volume=.3;bgm.play().catch(()=>{})}}
addEventListener('pointerdown',startMusic);
function apply(){$('#bSound').classList.toggle('off',!S.sound);$('#bMusic').classList.toggle('off',!S.music);$('#swMotion').classList.toggle('on',S.reduce);$('#swMotion').setAttribute('aria-checked',S.reduce);document.body.classList.toggle('reduce',S.reduce);if(!S.music)bgm.pause()}
$('#bSound').onclick=()=>{S.sound=!S.sound;store.set('sound',S.sound);apply();SFX.tap()};
$('#bMusic').onclick=()=>{S.music=!S.music;store.set('music',S.music);apply();if(S.music)startMusic();SFX.tap()};
function aboutSheet(on){$('#about').classList.toggle('on',on);$('#scrim').classList.toggle('on',on)}
$('#bAbout').onclick=()=>{SFX.tap();aboutSheet(true)};$('#aboutClose').onclick=$('#scrim').onclick=()=>aboutSheet(false);
$('#swMotion').onclick=()=>{S.reduce=!S.reduce;store.set('reduce',S.reduce);apply()};
apply();
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else startMusic()});
window.__pt={launch,goHome};
