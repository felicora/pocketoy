<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe6fa">
<title>POCKETOY · Tiny toys, Big memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3f2e66;--pink:#f27fb2;--lav:#cdb8f5;--cream:#fff6e0;--yel:#ffe27a;--mint:#9be3cf;--k:.35px;--font:"Baloo 2","Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(120% 90% at 50% 35%,#f8f1ff 0%,#eadff7 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.grain{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.09;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .4  0 0 0 .9 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.stage{position:relative;width:min(100vw,calc((100dvh - 64px) * 1110 / 1940));aspect-ratio:1110/1940;flex:none;user-select:none;-webkit-user-select:none}
.stage>*{position:absolute}
.machine{inset:0;width:100%;height:100%;display:block;transition:filter .4s;pointer-events:none;-webkit-user-drag:none}
.stage.launching .machine{filter:blur(1.4px) saturate(.8) brightness(.97)}
/* ambient machine light */
.glow{pointer-events:none;border-radius:50%;mix-blend-mode:screen}
.hdr{left:5%;top:2.4%;width:90%;height:11%;background:radial-gradient(closest-side,rgba(255,236,246,.8),rgba(255,236,246,0));animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.lamp{background:radial-gradient(closest-side,rgba(120,255,160,.95),rgba(120,255,160,0));opacity:0;animation:lamp 7s steps(1) infinite}
.coin{background:radial-gradient(closest-side,rgba(255,240,150,.95),rgba(255,240,150,0));border-radius:30%;opacity:0;animation:coin 11s steps(1) infinite 2s}
@keyframes lamp{0%,80%{opacity:0}82%,88%{opacity:.9}90%,100%{opacity:0}}
@keyframes coin{0%,70%{opacity:0}72%,78%{opacity:.75}80%,100%{opacity:0}}
.glass{overflow:hidden;pointer-events:none;z-index:8;border-radius:2%}
.glass i{position:absolute;top:-10%;left:-45%;width:20%;height:130%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-16deg);animation:refl 11s ease-in-out infinite}
.glass i+i{width:5%;animation-delay:.3s;opacity:.7}
@keyframes refl{0%,60%{left:-45%}100%{left:130%}}
.reduce .glass i,.reduce .hdr,.reduce .lamp,.reduce .coin{animation:none}.reduce .glass i{left:10%}
/* claw */
.claw{z-index:11;left:0;top:calc(var(--k)*378);width:calc(var(--k)*146.4);margin-left:calc(var(--k)*-73.2);pointer-events:none;--a:4deg}
.claw .csw{position:relative;display:flex;flex-direction:column;animation:csway 6.5s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes csway{0%{transform:translateX(calc(var(--k)*-4)) rotate(-1.2deg)}46%{transform:translateX(calc(var(--k)*5)) rotate(1.4deg)}54%{transform:translateX(calc(var(--k)*5)) rotate(1.1deg)}100%{transform:translateX(calc(var(--k)*-4)) rotate(-1.2deg)}}
.claw.seq .csw,.reduce .claw .csw{animation:none}
.claw img{display:block}
.claw .cstem{background-repeat:repeat-y;background-position:center top;overflow:hidden}
.claw .chd{position:relative}
.claw .arm{position:absolute;transition:transform .14s ease-out}
.claw .armL{transform:rotate(var(--a))}.claw .armR{transform:rotate(calc(var(--a)*-1))}
.claw.open{--a:16deg}.claw.closed{--a:-13deg}
.clack{z-index:14;pointer-events:none;font-weight:800;font-size:calc(var(--k)*70);color:#fff;-webkit-text-stroke:calc(var(--k)*10) var(--ink);paint-order:stroke fill;opacity:0;transform:translate(-50%,-50%) rotate(-8deg);white-space:nowrap}
.clack.go{animation:clack .55s ease-out}
@keyframes clack{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.4)}25%{opacity:1;transform:translate(-50%,-70%) rotate(-8deg) scale(1.15)}100%{opacity:0;transform:translate(-50%,-120%) rotate(-8deg) scale(1)}}
/* toys */
.toy{z-index:5;outline:none;border-radius:12%;transition:opacity .3s,filter .3s;perspective:calc(var(--k)*900)}
.toy .inner{position:absolute;inset:0;transform-origin:50% 92%;transition:transform .28s cubic-bezier(.3,1.6,.5,1),filter .3s;pointer-events:none}
.toy .mv{position:absolute;inset:0}
.toy .L{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none;max-width:none}
.toy .sh{position:absolute;left:8%;right:8%;bottom:-3%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(63,46,102,.3),rgba(63,46,102,0));pointer-events:none;opacity:.0;transition:opacity .3s}
.has-active .toy:not(.active){opacity:.6;filter:saturate(.7)}
.toy.active{z-index:7}
.toy.active .inner{transform:translateY(calc(var(--k)*-9)) scale(1.07);filter:drop-shadow(0 calc(var(--k)*10) calc(var(--k)*5) rgba(63,46,102,.32)) brightness(1.05)}
.toy.active .sh{opacity:1}
.toy:focus-visible{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--ink)}
.fx{position:absolute;pointer-events:none;z-index:3}
.toy.go{z-index:9}.toy.go .inner{transform:translateY(calc(var(--k)*-14)) scale(1.12)}
.stage.picking .toy:not(.go){opacity:.35;filter:saturate(.4)}
/* glint */
.glint{position:absolute;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);background-size:320% 100%;background-position:130% 0;opacity:0}
.idling .glint,.active .glint{opacity:1;animation:glint 1.3s ease-in-out}
@keyframes glint{from{background-position:130% 0}to{background-position:-30% 0}}
/* idle */
.idling .mv{animation:breath 2.8s ease-in-out}
@keyframes breath{50%{transform:translateY(calc(var(--k)*-2.5)) scale(1.012)}}
.t-pet.idling .mv{animation:hang 2.6s ease-in-out;transform-origin:50% 18%}
@keyframes hang{25%{transform:rotate(2.2deg)}55%{transform:rotate(-1.6deg)}80%{transform:rotate(.6deg)}}
.t-pet.idling .glow2{animation:flick 1.6s steps(1)}
@keyframes flick{10%,30%{opacity:.5}20%,40%,100%{opacity:0}}
.t-phone.idling .lcd{animation:flick 1.4s steps(1)}
/* PHONE */
.t-phone .mv{transform-origin:50% 94%}
.t-phone.active .mv{animation:rock .9s ease-in-out}
@keyframes rock{20%{transform:rotate(-3.2deg)}50%{transform:rotate(2.6deg)}75%{transform:rotate(-1deg)}}
.t-phone.active .ant{animation:wig .9s ease-in-out}
@keyframes wig{15%{transform:rotate(-14deg)}35%{transform:rotate(11deg)}55%{transform:rotate(-7deg)}75%{transform:rotate(4deg)}}
.lcd{background:#c7dda3;box-shadow:inset 0 0 8px rgba(80,120,70,.5),0 0 10px rgba(200,255,180,.6);opacity:0;transition:opacity .12s;container-type:inline-size;overflow:hidden;border-radius:6%}
.lcd u{position:absolute;left:50%;top:52%;width:1em;height:1em;font-size:5.6cqw;margin:-3em 0 0 -2.5em;text-decoration:none}
.t-phone.active .lcd{opacity:1}.t-phone.active .lcd u{animation:beat .6s steps(2) infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.keys{background:radial-gradient(closest-side,rgba(170,215,255,.75),rgba(170,215,255,0));mix-blend-mode:screen;opacity:0}
.t-phone.active .keys{animation:kf .7s steps(1) .3s}
@keyframes kf{0%,40%,80%{opacity:.9}20%,60%,100%{opacity:0}}
.t-phone.go .lcd{opacity:1;animation:lflash .4s steps(1)}.t-phone.go .keys{opacity:.95}
@keyframes lflash{0%,50%{filter:brightness(2.2)}25%,75%,100%{filter:none}}
/* CAPSULE */
.t-capsule .mv{transform-origin:50% 96%}
.t-capsule.active .mv{animation:wobble .85s ease-in-out}
@keyframes wobble{15%{transform:rotate(-2.2deg)}35%{transform:rotate(2.2deg)}55%{transform:rotate(-1.4deg)}75%{transform:rotate(.8deg)}}
.crank{transform-origin:6% 22%}
.t-capsule.active .crank{animation:crank .95s ease-in-out}.t-capsule.go .crank{animation:crank .5s ease-in-out}
@keyframes crank{50%{transform:rotate(70deg)}100%{transform:rotate(140deg)}}
.globe{overflow:hidden;border-radius:50%;opacity:0}
.t-capsule.active .globe{opacity:1}
.cb{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#f6a3c0 14%);border:calc(var(--k)*2.6) solid var(--ink)}
.t-capsule.active .cb{animation:cbo .45s ease-in-out infinite alternate}
.cb:nth-child(2){animation-delay:-.15s!important;animation-duration:.38s!important}.cb:nth-child(3){animation-delay:-.3s!important}.cb:nth-child(4){animation-duration:.5s!important}.cb:nth-child(5){animation-delay:-.2s!important}
@keyframes cbo{from{transform:translate(0,0)}to{transform:translate(calc(var(--k)*6),calc(var(--k)*-14))}}
.pop{opacity:0;width:11%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#f6a3c0 14%);border:calc(var(--k)*2.6) solid var(--ink)}
.t-capsule.active .pop,.t-capsule.go .pop{animation:pop 1s .35s ease-in forwards}
@keyframes pop{0%{opacity:0;transform:translateY(calc(var(--k)*-20))}20%{opacity:1}70%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(calc(var(--k)*6))}}
.spk{opacity:0;width:11%}
.t-capsule.active .spk,.t-capsule.go .spk{animation:spk .7s .9s ease-out}
@keyframes spk{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.2) rotate(60deg)}100%{opacity:0;transform:scale(.6) rotate(120deg)}}
/* FISHING */
.pond{overflow:hidden;border-radius:50%}
.rod{position:absolute;left:46%;top:-38%;width:9%;transform-origin:50% 38%;opacity:0;transition:opacity .2s}
.t-fishing.active .rod,.t-fishing.go .rod{opacity:1;animation:lower 1.4s ease-in-out forwards,swing 1.3s ease-in-out infinite alternate}
@keyframes lower{to{top:-4%}}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.f2{position:absolute;width:15%;left:68%;top:56%;opacity:0}
.t-fishing.active .f2,.t-fishing.go .f2{animation:fish 1.5s .3s ease-in-out forwards}
@keyframes fish{0%{opacity:1;transform:translate(0,0)}60%{opacity:1;transform:translate(-120%,-40%) rotate(-12deg)}75%{transform:translate(-125%,-48%) rotate(10deg)}100%{opacity:1;transform:translate(-120%,-44%) rotate(-4deg)}}
.bb{position:absolute;border:calc(var(--k)*2) solid rgba(255,255,255,.95);background:rgba(255,255,255,.35);border-radius:50%;width:5%;aspect-ratio:1;opacity:0}
.active .bb,.go .bb{animation:bub 1.4s ease-out infinite}.bb:nth-child(2n){animation-delay:.5s!important}.bb:nth-child(3n){animation-delay:.9s!important}
@keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--k)*-60))}}
.t-fishing.active .mv{animation:wob 1.1s ease-in-out}
@keyframes wob{30%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}}
/* PET */
.t-pet .inner{transform-origin:50% 18%}
.t-pet.active .mv{animation:pswing 1.9s ease-out;transform-origin:50% 18%}
@keyframes pswing{12%{transform:rotate(9deg)}28%{transform:rotate(-7deg)}46%{transform:rotate(5deg)}64%{transform:rotate(-3deg)}82%{transform:rotate(1.5deg)}}
.t-pet.active .chainc{animation:cswing 1.9s ease-out}
@keyframes cswing{12%{transform:rotate(5deg)}28%{transform:rotate(-6deg)}46%{transform:rotate(4deg)}64%{transform:rotate(-2deg)}}
.glow2{background:radial-gradient(closest-side,rgba(255,225,240,.95),rgba(255,225,240,0));opacity:0;transition:opacity .25s;mix-blend-mode:screen}
.t-pet.active .glow2{opacity:.85}.t-pet.go .glow2{opacity:1}
.t-pet .heart{transform-origin:50% 50%}
.t-pet.active .heart{animation:pulse .55s .2s ease-out}.t-pet.go .heart{animation:pulse .5s ease-out}
@keyframes pulse{40%{transform:scale(1.28)}}
.t-pet.go .mv{animation:pswing .7s ease-out}
/* WATERLOOPS */
.win{overflow:hidden;border-radius:14%}
.wave{position:absolute;left:-60%;top:34%;width:220%;height:14%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);opacity:0}
.t-waterloops.active .wave{opacity:1;animation:wv 1.6s ease-in-out}
@keyframes wv{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.wb{position:absolute;bottom:8%;width:6%;aspect-ratio:1;border:calc(var(--k)*2) solid rgba(255,255,255,.95);background:rgba(255,255,255,.3);border-radius:50%;opacity:0}
.active .wb,.go .wb{animation:wrise 1.5s ease-out infinite}.wb:nth-child(2){animation-delay:.3s!important}.wb:nth-child(3){animation-delay:.6s!important}.wb:nth-child(4){animation-delay:.9s!important}.wb:nth-child(5){animation-delay:1.1s!important}
@keyframes wrise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translate(calc(var(--k)*4),calc(var(--k)*-110))}}
.t-waterloops.active .ring0{animation:rfloat 1.7s .0s ease-in-out}.t-waterloops.active .ring1{animation:rfloat 1.7s .15s ease-in-out}.t-waterloops.active .ring2{animation:rfloat 1.7s .3s ease-in-out}
@keyframes rfloat{30%{transform:translate(calc(var(--k)*3),calc(var(--k)*-26)) rotate(8deg)}60%{transform:translate(calc(var(--k)*-3),calc(var(--k)*-18)) rotate(-6deg)}85%{transform:translate(0,calc(var(--k)*-3))}}
.t-waterloops.go .ring0,.t-waterloops.go .ring1,.t-waterloops.go .ring2{animation:rburst .5s ease-out}
@keyframes rburst{60%{transform:translateY(calc(var(--k)*-48)) rotate(14deg)}}
.t-waterloops.active .btnL{animation:press .5s .1s}.t-waterloops.active .btnR{animation:press .5s .4s}
@keyframes press{50%{transform:translateY(calc(var(--k)*3));filter:brightness(.88)}}
/* MAZE */
.t-maze .mv{transform:rotateY(calc(var(--tx,0)*7deg)) rotateX(calc(var(--ty,0)*-6deg));transition:transform .25s}
.t-maze.active .ball{animation:roll 1.5s ease-in-out}
@keyframes roll{0%{transform:translate(0,0)}25%{transform:translate(calc(var(--k)*-17),calc(var(--k)*2))}40%{transform:translate(calc(var(--k)*-14),calc(var(--k)*1))}70%{transform:translate(calc(var(--k)*17),calc(var(--k)*-3))}82%{transform:translate(calc(var(--k)*13),calc(var(--k)*-2))}100%{transform:translate(0,0)}}
.t-maze.go .ball{animation:roll2 .5s ease-in}
@keyframes roll2{to{transform:translate(calc(var(--k)*18),calc(var(--k)*-4))}}
.route{border-radius:30%;background:radial-gradient(closest-side,rgba(255,236,120,.0) 55%,rgba(255,236,120,.9) 80%,rgba(255,236,120,0));opacity:0;mix-blend-mode:screen}
.t-maze.go .route{animation:rt .5s ease-out}
@keyframes rt{50%{opacity:1}100%{opacity:.5}}
.t-maze.idling .ball{animation:roll 1.6s ease-in-out;transform:none}
/* SPIN */
.t-spin.active .mv{animation:swob .22s ease-in-out infinite alternate}
@keyframes swob{from{transform:translate(calc(var(--k)*-1),0) rotate(-.6deg)}to{transform:translate(calc(var(--k)*1),calc(var(--k)*-1)) rotate(.6deg)}}
.t-spin.settle .mv{animation:sset .5s ease-out}
@keyframes sset{30%{transform:rotate(2deg) translateX(calc(var(--k)*-2))}60%{transform:rotate(-1.4deg)}}
.trail{border-radius:50%;border:calc(var(--k)*3) dashed rgba(255,255,255,.85);opacity:0;transition:opacity .25s}
.t-spin.active .trail,.t-spin.go .trail{opacity:.75;animation:tr .5s linear infinite reverse}
@keyframes tr{to{transform:rotate(360deg)}}
.sparks{opacity:0;border-radius:50%}
.t-spin.active .sparks,.t-spin.go .sparks{opacity:1;animation:tr .6s linear infinite}
.sparks b{position:absolute;left:50%;top:-2%;width:10%;aspect-ratio:1;margin-left:-5%;background:#fff6a8;border:calc(var(--k)*1.5) solid var(--ink);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
/* labels */
.lab{z-index:20;display:flex;flex-direction:column;align-items:center;gap:calc(var(--k)*5);opacity:0;pointer-events:none;transform:translate(-50%,-6px) scale(.6);transform-origin:50% 0;transition:opacity .16s}
.lab.up{transform-origin:50% 100%;transform:translate(-50%,-100%) scale(.6)}
.lab.on{opacity:1;pointer-events:auto;animation:labin .3s cubic-bezier(.3,1.7,.5,1) forwards}
.lab.up.on{animation-name:labinup}
@keyframes labin{from{transform:translate(-50%,-6px) scale(.6)}to{transform:translate(-50%,0) scale(1)}}
@keyframes labinup{from{transform:translate(-50%,-100%) scale(.6)}to{transform:translate(-50%,-100%) scale(1)}}
.ttl{background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:1px 12px 0;font-weight:800;font-size:max(12px,calc(var(--k)*36));letter-spacing:.05em;line-height:1.4;white-space:nowrap;box-shadow:0 2px 0 rgba(63,46,102,.25),0 0 12px rgba(255,200,230,.7)}
.play{position:relative;overflow:hidden;height:max(30px,calc(var(--k)*74));min-width:max(72px,calc(var(--k)*190));padding:0 18px;border-radius:999px;border:2.5px solid var(--ink);background:linear-gradient(#ff9ccb,#f27fb2);color:#fff;font-weight:800;font-size:max(14px,calc(var(--k)*40));letter-spacing:.1em;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;box-shadow:0 3px 0 #b44d86;transition:transform .15s,border-color .15s}
.play::after{content:"";position:absolute;top:-30%;left:-60%;width:40%;height:160%;background:rgba(255,255,255,.7);transform:rotate(20deg);transition:none}
.play:hover{transform:scale(1.1);border-color:#7a58c4}.play:hover::after{left:130%;transition:left .5s}
.play:active,.play.sq{transform:scale(.92,.86);box-shadow:0 0 0 #b44d86}
.play:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px);transform:translate(-50%,20px);background:var(--cream);border:2.5px solid var(--ink);border-radius:18px;padding:8px 16px;font-weight:700;font-size:15px;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* control bar */
.bar{display:flex;gap:16px;height:64px;align-items:center;justify-content:center;flex:none}
.ctl{position:relative;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 #7a60b0,inset 0 3px 0 rgba(255,255,255,.55);transition:transform .08s,box-shadow .08s;display:grid;place-items:center}
.ctl:active{transform:translateY(4px);box-shadow:0 0 0 #7a60b0,inset 0 2px 0 rgba(0,0,0,.1)}
.ctl svg{width:56%;height:56%;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ctl.off{filter:saturate(.35);opacity:.85}.ctl.off::after{content:"";position:absolute;width:62%;height:3px;background:var(--ink);border-radius:3px;transform:rotate(-45deg)}
.ctl:focus-visible,.close:focus-visible,.sw:focus-visible,.home:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
/* game layer */
.game{position:fixed;inset:0;z-index:40;background:var(--cream);visibility:hidden}.game.on{visibility:visible}
.game iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream)}
.home{position:absolute;z-index:45;left:50%;top:env(safe-area-inset-top,0px);transform:translateX(-50%);height:30px;padding:0 14px 0 10px;border:2px solid var(--ink);border-top:0;border-radius:0 0 16px 16px;background:rgba(255,248,232,.95);font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(63,46,102,.2)}
.home svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.portal{position:fixed;z-index:60;display:none;background:#3a2a58;border:4px solid var(--lav);box-shadow:inset 0 10px 0 rgba(0,0,0,.18);overflow:hidden}
.portal .dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .3s}.portal.wait .dots{opacity:1}
.dots b{display:inline-block;width:12px;height:12px;margin:0 4px;border-radius:50%;background:var(--pink);animation:dt 1s infinite}.dots b:nth-child(2){background:var(--mint);animation-delay:.15s}.dots b:nth-child(3){background:var(--yel);animation-delay:.3s}
@keyframes dt{40%{transform:translateY(-9px)}}
/* about */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(63,46,102,.35);opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.about{position:fixed;z-index:81;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(92vw,380px);transform:translate(-50%,120%);background:var(--cream);border:3px solid var(--ink);border-radius:28px;padding:18px 20px 16px;text-align:center;transition:transform .3s cubic-bezier(.3,1.3,.5,1);box-shadow:0 6px 0 rgba(63,46,102,.2)}.about.on{transform:translate(-50%,0)}
.about h3{margin:0;font-size:26px;font-weight:800;letter-spacing:.06em;color:var(--pink);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.about p{margin:6px 0 12px;font-size:16px;line-height:1.3;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;padding:8px 0;border-top:2px dashed rgba(63,46,102,.2)}
.sw{width:56px;height:32px;border-radius:16px;border:3px solid var(--ink);background:#d5cbe6;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);transition:left .15s}.sw.on{background:var(--mint)}.sw.on::after{left:26px}
.close{margin-top:10px;width:100%;height:46px;border-radius:23px;border:3px solid var(--ink);background:var(--yel);font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(63,46,102,.25)}.close:active{transform:translateY(3px);box-shadow:none}
.reduce .toy .mv,.reduce .toy .L,.reduce .idling .mv{animation:none!important}
</style>

const store={get(k,d){try{const v=localStorage.getItem('pt:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pt:'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- audio ---------- */
let AC;const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}};
function tone(f1,f2,d,type='sine',v=.06,delay=0){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.08,delay=0,hp=1200){if(!S.sound)return;const a=ac();if(!a)return;const n=a.sampleRate*d,buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='highpass';f.frequency.value=hp;g.gain.value=v;s.buffer=buf;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+delay)}

 ph(){tone(1500,1500,.08,'square',.03);tone(1900,1900,.1,'square',.03,.12)},lc(){[0,.09,.18,.27].forEach(d=>noise(.05,.06,d,1500))},mf(){tone(700,1100,.12,'sine',.05);tone(500,800,.1,'sine',.035,.14)},
 pp(){tone(880,880,.07,'square',.025);tone(1175,1175,.09,'square',.025,.1)},pm(){[0,.12,.26].forEach(d=>noise(.06,.045,d,600))},wl(){[0,.15,.3].forEach((d,i)=>tone(500+i*160,900+i*160,.09,'sine',.045,d))},sc(){tone(200,900,.5,'sawtooth',.03);noise(.25,.03,.05,2500)},

/* ---------- claw (bracket + variable stem + head + two arms) ---------- */

<i class="glow hdr"></i><i class="glow lamp" style="${mp(950,770,76,76)}"></i><i class="glow coin" style="${mp(936,1000,90,50)}"></i>

const lab=$('#lab'),playBtn=$('#playBtn');

/* ---------- selection (one active toy at a time) ---------- */
let active=null,busy=false,pt='mouse',kb=false,leaveT=null;
function showLab(id){const c=byId[id],b=c.box,up=c.side==='up';lab.querySelector('.ttl').textContent=c.name;lab.classList.toggle('up',up);
 const cxp=(b.x+b.w/2)*K,w=lab.offsetWidth||120,pad=4;lab.style.left=Math.max(w/2+pad,Math.min(stage.clientWidth-w/2-pad,cxp))+'px';

function activate(id){if(busy||active===id)return;clearTimeout(leaveT);if(active)deact(active,true);active=id;const c=byId[id];c.el.classList.add('active');stage.classList.add('has-active');
 showLab(id);lab.classList.remove('on');void lab.offsetWidth;lab.classList.add('on');SFX[c.snd]&&SFX[c.snd]();if(id==='spin')spinTarget=900;if(id==='phone')lcdBeat()}

 if(!quick){active=null;stage.classList.remove('has-active');lab.classList.remove('on')}}

 el.addEventListener('pointerenter',e=>{pt=e.pointerType;if(e.pointerType==='mouse')activate(c.id)});

 el.addEventListener('pointerdown',e=>{pt=e.pointerType;kb=false});

 el.addEventListener('focus',()=>{if(el.matches(':focus-visible'))activate(c.id)});
 el.addEventListener('click',()=>{if(busy)return;const direct=pt==='mouse'||kb;kb=false;if(direct||active===c.id)launch(c.id);else activate(c.id)});
});
lab.addEventListener('pointerenter',()=>clearTimeout(leaveT));lab.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')release()});
playBtn.addEventListener('click',e=>{e.stopPropagation();if(active&&!busy)launch(active)});
document.addEventListener('pointerdown',e=>{if(!busy&&active&&e.pointerType!=='mouse'&&!e.target.closest('.toy,.lab'))deact(active,false)},true);
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')release()});
/* ---------- spin physics (JS so slow-down returns to the original orientation) ---------- */
let ang=0,vel=0,spinTarget=0,lastT=performance.now();
function spinLoop(t){const dt=Math.min(.05,(t-lastT)/1000);lastT=t;const el=byId.spin.el,img=el.querySelector('.body');
 if(!S.reduce&&(spinTarget>0||vel>2||ang!==0)){
  const rate=spinTarget>0?2.2:3.2;vel+=(spinTarget-vel)*(1-Math.exp(-dt*rate));ang+=vel*dt;
  if(spinTarget===0&&vel<60){const tgt=Math.round(ang/360)*360;ang+=(tgt-ang)*(1-Math.exp(-dt*9));if(Math.abs(tgt-ang)<.4&&vel<8){ang=0;vel=0}}
  img.style.transform=`rotate(${ang}deg)`}
 else if(img.style.transform){img.style.transform='';ang=0;vel=0}
 requestAnimationFrame(spinLoop)}
requestAnimationFrame(spinLoop);
/* ---------- idle (staggered, one toy at a time) ---------- */
setInterval(()=>{if(busy||active||document.hidden||S.reduce)return;const c=CFG[Math.floor(Math.random()*CFG.length)];if(c.id==='spin'){c.el.classList.remove('idling');void c.el.offsetWidth}
 c.el.classList.add('idling');setTimeout(()=>c.el.classList.remove('idling'),2900)},3200);
/* claw state & helpers (units = machine pixels) */
const clawEl=$('#claw'),stemEl=$('#cstem'),HOMEX=D.claw.box.x+D.claw.box.w/2,CTOP=D.claw.box.y+CP.bracket.y,TRAY={x:465,y:1480};
let clawX=HOMEX,stemS=S0;

const moveClaw=(x,ms,ease)=>{const a=clawX;clawX=x;return A(clawEl,[{transform:`translateX(${a*K}px)`},{transform:`translateX(${x*K}px)`}],ms,ease)};

 return A(c.el,[{transform:from,opacity:c.op},{transform:`translate(${x*K}px,${y*K}px) rotate(${rot}deg) scale(${sc})`,opacity:op??c.op}],ms,ease).then(()=>{c.op=op??c.op})}

paintClaw();
/* the occasional decorative trip along the rail */
let lastAct=Date.now();['pointermove','pointerdown','keydown'].forEach(e=>addEventListener(e,()=>lastAct=Date.now(),{passive:true}));
setInterval(()=>{if(busy||S.reduce||document.hidden||Date.now()-lastAct<9000)return;const x0=clawX;clawEl.animate([{transform:`translateX(${x0*K}px)`},{transform:`translateX(${(x0+46)*K}px)`,offset:.45},{transform:`translateX(${(x0+46)*K}px)`,offset:.6},{transform:`translateX(${x0*K}px)`}],{duration:4200,easing:'ease-in-out'})},14000);
/* ---------- launch ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function A(el,kf,ms,ease='ease-in-out'){const a=el.animate(kf,{duration:ms,easing:ease,fill:'forwards'});return a.finished.then(()=>{try{a.commitStyles()}catch(e){}a.cancel()})}
const px=n=>n+'px';
let current=null,loadP=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3200)}
async function exists(src){if(location.protocol.indexOf('http')!==0)return true;try{const r=await fetch(src,{method:'HEAD',cache:'no-store'});return r.ok}catch(e){return true}}
function startLoad(c){const f=document.createElement('iframe');f.title=c.name;f.allow='autoplay; fullscreen; accelerometer; gyroscope';

function chuteRect(){const r=stage.getBoundingClientRect(),X0=84,Y0=20;return{l:r.left+(262-X0)*K,t:r.top+(1452-Y0)*K,w:(836-262)*K,h:(1585-1452)*K,rad:12*K}}
async function portalOpen(ms){const r=chuteRect();
 if(S.reduce){portal.style.cssText='display:block;left:0;top:0;width:100vw;height:100dvh;border-radius:0;opacity:0';await A(portal,[{opacity:0},{opacity:1}],220,'ease');return}
 portal.style.cssText=`display:block;left:${r.l}px;top:${r.t}px;width:${r.w}px;height:${r.h}px;border-radius:${r.rad}px`;SFX.thunk();
 await A(portal,[{left:px(r.l),top:px(r.t),width:px(r.w),height:px(r.h),borderRadius:px(r.rad)},{left:'0px',top:'0px',width:'100vw',height:'100dvh',borderRadius:'0px'}],ms,'cubic-bezier(.6,0,.25,1)')}
/* FIRST selection of the session: the complete claw sequence */
async function fullSeq(c){const b=c.box,tcx=b.x+b.w/2,sG=Math.max(SMIN,(b.y+b.h*.5-CTOP)/CSC-CP.bracket.h-ARM_B);
 await sleep(240);                                            // toy bounces, others fade
 SFX.move();armsOpen();SFX.open();
 await Promise.all([moveStem(SMIN,260,'ease-in'),moveClaw(tcx,560,'cubic-bezier(.5,0,.2,1)')]);   // rail slides above the toy

 armsClose();SFX.clack();popClack(tcx,tipOf(sG)-20);          // grab + CLACK

 if(lift>1)await Promise.all([moveStem(sG-lift/CSC,300),moveToy(c,0,-lift,0,1,300)]);else await sleep(100);
 const dx=TRAY.x-tcx;SFX.move();                              // carry toward the prize chute, toy sways underneath
 c.el.animate([{transform:`translate(0,${-lift*K}px) rotate(0deg)`},{transform:`translate(${dx*.5*K}px,${-lift*K}px) rotate(9deg)`},{transform:`translate(${dx*K}px,${-lift*K}px) rotate(-4deg)`}],{duration:520,easing:'ease-in-out',fill:'forwards'});
 await moveClaw(TRAY.x,520,'ease-in-out');c.tx=dx;c.ty=-lift;c.rot=-4;
 c.el.getAnimations().forEach(a=>{try{a.commitStyles()}catch(e){}a.cancel()});

 c.el.style.zIndex=12;moveStem(S0,420);moveClaw(HOMEX,520);setTimeout(armsClose,300);

async function launch(id){if(busy)return;const c=byId[id];
 if(!(await exists(c.src))){toast(c.name+' isn’t installed yet. Add '+c.src+' next to this file.');c.el.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],220);return}

 portal.style.cssText='display:block;left:0;top:0;width:100vw;height:100dvh;border-radius:0;opacity:0';await A(portal,[{opacity:0},{opacity:1}],S.reduce?160:200,'ease');
